</style></head><body><aside class="sidebar"><div class="logo"><span style="font-family:Georgia,serif;font-size:29px;letter-spacing:1px;color:#fff">VIVAIA</span></div><div class="side-system" id="sideSystem">DMS 经销商管理</div><nav id="nav"></nav><div class="sidebottom"><span class="v2pill">VERSION 2.0</span><br>香港 FOB-2C · 销售订单复用<br>2026.10.13</div></aside><header class="topbar"><div class="top-tab" onclick="switchApp(app)">首页</div><div class="top-tab active" id="topTab">销售订单 ⟳</div><div class="toptools"><span>Shanghai UTC+08:00 ▾</span><span>♙ 演示用户</span></div></header><div class="workspace"><div class="demobar"><strong>香港 FOB-2C</strong><span class="tag">V2 · 销售订单复用</span><span class="tagline">演示数据 · 本地保存</span><div class="switch"><button id="dmsSwitch" onclick="switchApp('DMS')">DMS</button><button id="brandSwitch" onclick="switchApp('Brand')">Brand</button><button id="erpSwitch" onclick="switchApp('ERP')">ERP</button></div><select id="role" aria-label="演示角色" onchange="roleChange(this.value)"><option value="all">全部权限（演示）</option><option value="buyer">业务同事</option><option value="logistics">物流同事</option><option value="finance">财务同事</option></select><button class="link" onclick="go('plan')">V2 方案说明</button><a href="香港FOB-2C-交互方案.html" target="_blank" rel="noopener">查看V1</a><button class="link" onclick="resetDemo()">重置V2</button></div><main id="main" class="content"></main></div><div id="modalroot"></div><div id="toastroot" role="status" aria-live="polite"></div><script>const PLAN_HTML="<div class=\"plan\"><div class=\"planhero\"><div style=\"display:flex;justify-content:space-between\"><span class=\"tag\">V2 · 销售订单复用方案</span><button class=\"primary\" onclick=\"switchApp('DMS')\">进入销售订单 →</button></div><h1>香港 FOB-2C · V2 系统方案</h1><p>2026.10.12　｜　保留 V1 独立文件　｜　复用页面与数据表，按业务类型区分</p></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>01　这次调整的七个方向</h2><table><thead><tr><th style=\"width:22%\">调整项</th><th>V2 落地方式</th></tr></thead><tbody><tr><td>版本独立</td><td>生成新的 V2 HTML，单独的浏览器存储键；V1文件及数据保留。</td></tr><tr><td>复用销售订单</td><td>DMS「销售 → 销售订单」统一承载普通销售与香港 FOB-2C。列表增加业务类型标识、代发费用列；详情在同一页面按业务类型展示物流与费用模块。移除采购菜单下的独立代发入口。</td></tr><tr><td>门店与收件信息</td><td>列表复用现有门店筛选与门店列；创建增加门店下拉。国家 → 州省 → 城市级联下拉，邮编、详细地址输入，不再展示或导入地区字段。商品支持一次勾选多个SKU和各自数量。</td></tr><tr><td>订单批导</td><td>删除导入订单标识，按同一文件内「客户姓名＋手机号」组单。同一客户的门店、地址冲突则报错；相同SKU合并数量。不自动归并历史订单。</td></tr><tr><td>物流费用</td><td>不勾选列表订单、不弹出手工维护表。独立上传只有「订单号、物流费用」两列的文件，先匹配校验，再展示新旧金额，确认后批量覆盖。</td></tr><tr><td>操作费时点</td><td>创建 / 部分发货均不计算。全部商品发货完成事件触发后端计算并保存费率、币种、汇率、计费数量与结果快照；重复回调不重复计算。</td></tr><tr><td>订单状态</td><td>直接使用现有销售订单枚举：待付款、已取消、已完成、已售后、部分付款。去掉V1的草稿、已提交、已维护状态；物流费用是否完整作为费用字段展示。</td></tr></tbody></table></div></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>02　当前代码核对结果</h2><p>两个仓库于本次执行 <code>git pull --ff-only origin master</code>，均已是最新，工作区干净。方案没有修改业务代码。</p><p><b>后端：</b><code>d5f1c3a78a2d36359fe6d2152cd711223a03f58e</code><br><b>前端：</b><code>c332bf1c7c4ff25c7e6ce3f5bc48bc5c6889b783</code></p><table><thead><tr><th style=\"width:23%\">已存在能力</th><th>证据与本次扩展</th></tr></thead><tbody><tr><td>前端统一应用</td><td>Vue 3 + Vite + Element Plus，DMS/Brand 位于 packages/drp。销售订单已有列表、详情、门店筛选、支付与发货状态，适合原位增加订单来源、发货方式及代发费用字段；列表不单独展示业务类型列；详情费用按 CNY 金额、汇率、USD 金额并列展示。</td></tr><tr><td>销售订单读取接口</td><td><code>/tenant/shop/order/page</code>、<code>/metadata</code>、<code>/detail/{orderId}</code>、<code>/operate-logs/{orderId}</code>、<code>/export</code> 已存在。当前 TenantShopOrderController 主要提供查询 / 导出；本次创建和导入需要补充写入能力，不能宣称现成可调用。</td></tr><tr><td>现有持久化</td><td>ShopOrderMapper直接查询 <code>shop_order</code> 和 <code>shop_order_line_item</code>。订单已有 shopId、orderNumber、orderCategory、orderSource、status、onlineShipmentStatus、金额字段。继续使用此订单主表与商品明细，不新增代发订单主表。</td></tr><tr><td>业务类型区分</td><td>现有 ShopOrderCategoryEnum 有 NORMAL、VPLUS_SALE、VIRTUAL_GIFT_CARD_SALE，描述经营业务而非来源渠道。建议新增 <code>HK_FOB_2C</code> 类别；DMS录入 / 批导属于来源，应单独确认来源枚举扩展，不混用 orderCategory 与 orderSource。</td></tr><tr><td>付款与订单状态</td><td><code>ShopOrder.markPaid()</code> 在付清时设置 COMPLETED，部分付款设置 PART_PAID。因此销售「已完成」并不代表发货完成。原型创建暂用UNPAID，模拟支付回传后到COMPLETED；生产接入需沿用真实交易链路。</td></tr><tr><td>发货与签收</td><td>ShopOrderOnlineShipmentStatusEnum已有待发货(0)、部分发货(1)、已发货(2)。ShopOrderOnlineShipment已有trackingNumber、deliveryTime、signedTime，及shipmentItems。签收时间沿用发货记录，展示「已签收」标记，不增加销售订单状态。</td></tr><tr><td>Brand 财务</td><td>应收列表和详情保留。账单类型新增「代发订单」；来源关联改为销售订单。代发账单明细增加门店，保留订单号、物流费、操作费、创建时间、发货完成时间，SKU不在账单明细展示。</td></tr></tbody></table></div></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>03　状态与计费触发</h2><div class=\"flow\"><div class=\"flowbox\">创建 / 批量导入<small>销售订单 · 待付款</small></div><span>→</span><div class=\"flowbox\">原支付业务回传<small>部分付款 / 已完成</small></div><span>→</span><div class=\"flowbox\">仓库全部发货完成<small>计算并冻结操作费快照</small></div><span>→</span><div class=\"flowbox\">费用齐备后入账<small>Brand代发费用账单</small></div></div><div class=\"notice\">物流费导入是独立动作，可早于或晚于发货完成。它既不修改订单状态，也不触发操作费重算。发货状态值 0 必须显式处理，避免使用 truthy 判断漏掉「待发货」。</div><table><thead><tr><th>状态维度</th><th>编码及含义</th><th>约束</th></tr></thead><tbody><tr><td>订单状态</td><td>UNPAID=1 待付款<br>CANCEL=2 已取消<br>COMPLETED=3 已完成<br>AFTER_SALE=4 已售后<br>PART_PAID=5 部分付款</td><td>直接复用ShopOrderStatusEnum，不定义代发专属状态。导入费用不能把订单改成「已维护」。</td></tr><tr><td>发货状态</td><td>PENDING_SHIPMENT=0 待发货<br>PARTIAL_SHIPMENT=1 部分发货<br>SHIPPED=2 已发货</td><td>沿用当前销售发货聚合逻辑，逐商品 / 包裹累加已发数量；全部有效履约商品完成后才触发计费。</td></tr><tr><td>物流费</td><td>null=待导入；0=合法零金额</td><td>非负金额，最多2位小数；导入值覆盖原值，不叠加。已入账金额冻结，后续差异走财务调整。</td></tr><tr><td>操作费</td><td>null=尚未计算；feeCalculatedAt / snapshotNo=已计算证据</td><td>发货完成时根据适用费率与实际计费数量计算。计算失败保留「已发货」，独立记录失败并重试，不回滚真实履约状态，不把失败记为0。</td></tr><tr><td>签收</td><td>复用 signedTime 与物流节点</td><td>仅提供签收标记和时间，签收回调不重复计算操作费。</td></tr></tbody></table><h3>操作费幂等与异常</h3><p>后端以「销售订单ID＋履约完成版本」建立计费幂等键，发货回调去重并校验旧状态与有效商品数量；在计费事务中读取适用规则、计算金额、持久化快照与日志。部分发货保持operationFee为空。重复发货回调或物流费二次导入不得改变已计算快照。</p><p>取消 / 售后涉及的数量修订、退件与重发，需要明确适用规则后按既有售后业务调整；不能只看到状态SHIPPED就再次叠加费用。示例费率为2.50 / 3.00 USD每件，正式费率未被本方案确定。</p></div></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>04　复用数据表的字段设计（建议，尚未实现）</h2><table><thead><tr><th style=\"width:25%\">对象</th><th>复用 / 扩展</th><th>数据边界</th></tr></thead><tbody><tr><td><code>shop_order</code></td><td>复用订单ID、orderNumber、shopId、status、orderCategory、orderSource、金额、下单时间。新增HK_FOB_2C类别与代发收件快照字段：receiverName、receiverPhone、countryCode、provinceCode/name、cityCode/name、postalCode、address1。</td><td>不增加地区字段。国家 / 州省 / 城市存编码及名称快照；与客户资料当前地址区分，避免客户改地址改变历史订单。</td></tr><tr><td><code>shop_order</code> 费用字段</td><td>logisticsFee、operationFee、feeCurrency、feeVersion、feeCalculatedAt、operationFeeSnapshotNo、shipmentCompletedAt、feeCalculationResult。</td><td>两类代发费用不写入currentTotalPrice等商品交易额，避免销售统计 / 税费 / 会员积分 / 支付金额变化。物流费导入null与0严格区分。</td></tr><tr><td><code>shop_order_line_item</code></td><td>沿用SKU、数量、售价、税费、折扣、明细版本体系；如需逐SKU计费追溯，补操作费单价、小计或通过快照引用记录。</td><td>必须通过既有订单创建业务服务同步行项目及flat等附属结构，不能只插主表与明细。库存、交易、日志和报表影响需专项验证。</td></tr><tr><td><code>shop_order_online_shipment</code> 与shipment item</td><td>复用发货单、跟踪号、发货时间、签收时间、订单商品发货关系。物流轨迹能力接既有客户端，按香港实际仓库渠道适配。</td><td>多包裹一对多，订单发货完成时间取最后一笔有效发货完成时间；保留首次发货时间，避免混淆计费触发。</td></tr><tr><td>费用快照、操作日志、导入记录</td><td>支持新增必要的费用快照 / 导入任务附属记录；订单仍只存在于销售订单表。记录导入人、批次、文件摘要、旧值、新值、版本与时间。</td><td>文件摘要和批次ID由系统生成，模板中不恢复「导入订单标识」。金额采用BigDecimal，按统一币种及舍入策略处理。</td></tr><tr><td>账单费用快照明细</td><td>Brand账单关联shopOrderId / orderNumber / shopId，持久化物流费、操作费、订单创建与发货完成时间。</td><td>沿用财务账单主表；新增订单级代发费用明细结构，避免借用现有SKU账单明细临时聚合。唯一结算关联防重复入账。</td></tr></tbody></table></div></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>05　两个导入流程</h2><h3>A. 销售订单导入</h3><p><b>模板字段：</b>门店、客户姓名、手机号、国家、州省、城市、邮编、详细地址、SKU、数量。没有导入订单标识，没有地区。</p><p>按单文件中的客户姓名＋手机号组单：姓名去首尾空白，不做模糊匹配；手机号去空格、括号和连字符，保留国际区号。同一姓名不同手机号、同一手机号不同姓名均为不同订单。同组不同SKU合并为一单；同组重复SKU汇总数量并检查上限。</p><p>相同组内出现不同门店、国家、州省、城市、邮编或详细地址时，返回冲突行号，整批不落单。组单边界仅限本次文件；历史同名同手机号的订单不追加。相同文件重试通过系统导入批次及摘要幂等；合法的新订单批次应通过明确的新建批次流程区分，不能永久按客户或文件内容封禁。</p><h3>B. 物流费用导入</h3><p><b>模板字段：</b>订单号、物流费用。没有门店、客户信息或操作费输入。门店从订单反查展示，币种取订单代发结算币种；原型统一USD。</p><p>先校验格式、非负金额、最多2位小数、订单存在性、租户 / 门店权限、代发业务类型、取消 / 售后状态、入账锁定和文件内重复订单号。校验通过后展示订单号、门店、原费用、新费用及保持不变的销售状态，确认后整体事务保存并记录审计。</p><p>确认时再次校验费用版本与入账标记，防止预览后被其他用户维护或已入账。异常返回逐行错误清单；不做静默忽略或部分成功。</p><div class=\"notice\">本HTML可实际上传、预览和导出CSV（UTF-8，2MB / 500行），所有数据仅保存在本浏览器V2存储空间。生产建议以现有文件服务提供XLSX模板和异步大文件任务，格式与上限由实施阶段确认。</div></div></div>\n<div class=\"section\"><div class=\"sectionbody\"><h2>06　前后端改造位置与API草案</h2><table><thead><tr><th style=\"width:44%\">位置 / 接口</th><th>调整方式</th></tr></thead><tbody><tr><td><code>dms/views/sale/order.vue</code><br><code>dms/views/sale/detail.vue</code></td><td>原列表新增类别筛选、类型标记和代发费用列；现有门店列 / 筛选继续复用。详情增加条件显示的收件快照、物流、费用、审计区；普通销售不显示代发操作。新增创建作为销售模块子路由，不新建「代发订单」菜单。</td></tr><tr><td><code>GET /tenant/shop/order/metadata</code><br><code>POST /tenant/shop/order/page</code><br><code>GET /tenant/shop/order/detail/{orderId}</code></td><td>扩展已有查询DTO、VO与元数据；状态仍返回既有枚举结构。沿用page嵌套分页请求和items/totalItems响应，不照搬采购接口分页结构。</td></tr><tr><td><code>POST /tenant/shop/order/create</code><br><code>POST /tenant/shop/order/import/validate</code><br><code>POST /tenant/shop/order/import/confirm</code></td><td>新增DMS写入API草案，复用ShopOrder服务体系；校验门店归属、SKU可售范围、价格和税务上下文。创建状态由既有交易语义决定，不能伪造支付成功。确认导入绑定租户、批次、摘要与校验令牌。</td></tr><tr><td><code>POST /tenant/shop/order/logistics-fee/import/validate</code><br><code>POST /tenant/shop/order/logistics-fee/import/confirm</code></td><td>新增费用文件校验与确认；按orderNumber解析orderId，保存金额时做版本校验。权限建议t.shop.order.sales.logistics-fee.import，具体权限码由项目登记。</td></tr><tr><td>销售订单履约完成事件</td><td>在现有发货聚合逻辑确认全量完成后增加计费处理；复用计价基础与快照能力，使用代发专用业务适配，不直接调用会重写采购金额的TenantOrderOperationFeeCalculateService。</td></tr><tr><td><code>/system/finance/bill/metadata</code><br><code>/system/finance/bill/list</code><br><code>/system/finance/bill/detail</code></td><td>扩展代发账单类型与销售订单来源类型；新增代发账单订单级明细接口。Brand只读溯源必须使用system侧授权接口，不从Brand直接调用tenant API。</td></tr></tbody></table><div class=\"notice\">上述新字段、写入API与权限码为设计草案，尚未在仓库实现。当前已验证的原接口、路由、模型与新增建议在本方案中分别说明。</div></div></div>\n<div class=\"plan-grid\"><div class=\"section\"><div class=\"sectionbody\"><h2>07　权限、账单与待确认口径</h2><ul><li>业务同事：订单创建、商品批量添加、订单批导；物流同事：物流费用文件导入；财务：Brand账单与授权只读溯源。服务端校验租户与门店范围。</li><li>代发应收金额＝Σ(物流费＋操作费)。商品销售额单独保留，不加入此费用账单。</li><li>原型在「已完成＋全部发货完成＋费用齐备＋未入账」时允许模拟入账；结算周期、是否允许货到付款等实际条件仍需确认。</li><li>订单创建后以待付款开始是本原型的建议口径；若业务已有线下结算凭据，需通过既有受支持流程回写支付状态，不能直接把代发创建当成已完成。</li><li>操作费的适用费率、最低消费、按件 / 按单、汇率及税费尚需确认；本次确定的是计算时点。</li><li>跨国地址库覆盖、无州省国家的选项规则，以及同客户确需在同一文件拆成多单的业务场景需另定规则；当前严格按用户指定的姓名＋手机号合单。</li><li>取消、售后、退件、重发等费用冲正规则需衔接既有售后体系。</li></ul></div></div><div class=\"section\"><div class=\"sectionbody\"><h2>08　可操作的演示路径</h2><ol style=\"padding-left:20px;line-height:2\"><li>销售订单：切换全部 / 普通销售 / 香港FOB-2C，并使用门店、订单状态和发货状态筛选。</li><li>新增订单：填入示例 → 批量添加商品 → 多选SKU及数量 → 创建，订单进入待付款。</li><li>订单批导：有效示例将同客户两行商品合成一单；异常示例展示同客户门店 / 地址冲突。</li><li>物流费导入：两列文件 → 校验预览 → 确认；状态不变，支持0元，已入账金额不可覆盖。</li><li>订单详情：模拟支付完成 → 模拟部分发货，操作费仍为空 → 模拟全部发货完成，显示操作费。</li><li>重放发货完成回调：操作费不变；模拟签收只补充签收信息。</li><li>Brand：生成并查看订单级账单，包含门店和发货完成时间；账单金额等于两类费用合计。</li></ol></div></div></div>\n<div class=\"section\"><div class=\"sectionbody plansources\"><h2>09　代码依据</h2><p>路径相对各自仓库根目录，本次检索基于上方master提交。附件截图仅作为UI参考。</p><ul><li>前端 <code>packages/drp/src/pages/dms/views/sale/order.vue</code>：门店筛选和列、现有销售字段、状态元数据、page分页结构。</li><li>前端 <code>packages/drp/src/pages/dms/views/sale/detail.vue</code>、<code>packages/drp/src/pages/dms/apis/sale/index.js</code>、<code>packages/drp/src/pages/dms/router/routes.js</code>：销售详情、读取API与路由。</li><li>前端 <code>packages/drp/src/pages/brand/views/finance/receivable-bills/Detail.vue</code>：应收详情改造入口。</li><li>后端 <code>dms-webapi/src/main/java/com/starlink/dms/web/controller/tenant/TenantShopOrderController.java</code>：查询、导出及租户身份过滤。</li><li>后端 <code>dms-core/src/main/java/com/starlink/dms/core/shop/order/entity/ShopOrder.java</code>：shopId、orderCategory、状态与金额；markPaid()和发货状态更新。</li><li>后端 <code>dms-core/src/main/java/com/starlink/dms/core/shop/order/enums/ShopOrderStatusEnum.java</code>、<code>ShopOrderOnlineShipmentStatusEnum.java</code>、<code>ShopOrderCategoryEnum.java</code>：状态值及业务分类定义。</li><li>后端 <code>dms-core/src/main/java/com/starlink/dms/core/shop/order/entity/ShopOrderLineItem.java</code>、<code>ShopOrderOnlineShipment.java</code>：商品明细、发货与签收结构。</li><li>后端 <code>dms-core/src/main/java/com/starlink/dms/core/shop/order/mapper/ShopOrderMapper.java</code>：shop_order / shop_order_line_item真实查询；<code>shop/order/vo/ShopOrderQueryModels.java</code>：列表与详情输出。</li></ul></div></div></div>\n";

function filtered(){return db.orders.filter(o=>(typeTab==='全部'||o.kind===typeTab)&&(!filters.shop||o.shop===filters.shop)&&(filters.status===''||o.status===Number(filters.status))&&(filters.ship===''||o.shipping===Number(filters.ship))&&(!filters.q||[o.id,o.name,o.phone,...o.items.map(i=>i.sku)].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.start||o.created.slice(0,10)>=filters.start)&&(!filters.end||o.created.slice(0,10)<=filters.end))}
function renderList(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);$('#main').innerHTML=`<div class="filter"><select id="fshop" aria-label="门店筛选">${opts(shops,filters.shop,'全部门店')}</select><select id="fstatus" aria-label="订单状态筛选">${enumOpts(STATUS,filters.status,'订单状态')}</select><select id="fship" aria-label="发货状态筛选">${enumOpts(SHIP,filters.ship,'发货状态')}</select><input id="fq" class="search" aria-label="搜索订单" placeholder="订单号 / 客户姓名 / 手机号 / SKU" value="${esc(filters.q)}" onkeydown="if(event.key==='Enter')searchOrders()"><span class="filterlabel">下单时间</span><input type="date" id="fstart" aria-label="开始时间" value="${filters.start}"><span>—</span><input type="date" id="fend" aria-label="结束时间" value="${filters.end}"><button class="primary" onclick="searchOrders()">查询</button><button onclick="resetFilters()">重置</button></div><div class="filter-tags">${tag('销售订单统一管理')}　<span>普通销售与香港 FOB-2C 共用列表；物流费用与商品销售金额分别展示</span></div><div class="tablepanel"><div class="status-tabs">${[['全部','全部订单'],['NORMAL','普通销售'],['FOB_2C','香港 FOB-2C']].map(([v,t])=>`<button class="${typeTab===v?'active':''}" onclick="typeTab='${v}';page=1;renderList()">${t}<span class="count">${db.orders.filter(o=>v==='全部'||o.kind===v).length}</span></button>`).join('')}</div><div class="toolbar"><button class="primary" ${can('edit')?'':'disabled'} onclick="newOrder()">新增订单</button><button ${can('edit')?'':'disabled'} onclick="openImport('orders')">批量导入订单</button><button ${can('fee')?'':'disabled'} onclick="openImport('fees')">导入物流费用</button><button onclick="exportOrders()">导出</button><span class="right">共 ${rows.length} 条　｜　费用币种 USD</span></div><div class="tablewrap"><table style="min-width:1710px"><thead><tr>${['门店名称','订单编号','客户姓名 / 手机号','订单来源','支付方式','商品数量','销售金额(USD)','订单状态','发货方式','发货状态','物流费(USD)','操作费(USD)','下单时间'].map(h=>`<th>${h}</th>`).join('')}<th class="sticky">操作</th></tr></thead><tbody>${rows.slice((page-1)*pageSize,page*pageSize).map(o=>`<tr><td>${o.shop}</td><td><button class="link" onclick="openDetail('${o.id}')">${o.id}</button></td><td>${esc(o.name)}<small>${esc(o.phone)}</small></td><td>${o.source}</td><td>${o.payment}</td><td class="num">${quantity(o)}</td><td class="num">${money(total(o))}</td><td>${orderTag(o.status)}</td><td>${o.kind==='FOB_2C'?'线上':'门店'}</td><td>${shipTag(o.shipping)}${o.signed?'<small>已签收</small>':''}</td><td class="num">${o.kind==='NORMAL'?'—':o.freight===null?tag('待导入','orange'):money(o.freight)}</td><td class="num">${o.kind==='NORMAL'?'—':o.operation===null?tag('待计算','orange'):money(o.operation)}</td><td>${o.created.slice(0,10)}<small>${o.created.slice(11)}</small></td><td class="sticky"><button class="link" onclick="openDetail('${o.id}')">详情</button>${o.bill?`<button class="link" onclick="app='Brand';go('bill','${o.bill}')">账单</button>`:''}</td></tr>`).join('')||'<tr><td colspan="14" class="empty">暂无符合条件的订单</td></tr>'}</tbody></table></div><div class="tablefoot"><span class="total">订单状态沿用销售订单；导入费用不改变状态</span><span>共 ${rows.length} 条</span><select aria-label="每页条数" onchange="pageSize=Number(this.value);page=1;renderList()"><option value="10" ${pageSize===10?'selected':''}>10条/页</option><option value="20" ${pageSize===20?'selected':''}>20条/页</option></select><button ${page===1?'disabled':''} aria-label="上一页" onclick="page--;renderList()">‹</button><span class="page">${page}</span><button ${page>=pages?'disabled':''} aria-label="下一页" onclick="page++;renderList()">›</button></div></div>`}
function searchOrders(){if($('#fstart').value&&$('#fend').value&&$('#fstart').value>$('#fend').value)return toast('开始时间不能晚于结束时间','error');filters={shop:$('#fshop').value,status:$('#fstatus').value,ship:$('#fship').value,q:$('#fq').value.trim(),start:$('#fstart').value,end:$('#fend').value};page=1;renderList()}function resetFilters(){filters={shop:'',status:'',ship:'',q:'',start:'',end:''};typeTab='全部';page=1;renderList()}
function newOrder(){draft={shop:'',name:'',phone:'',country:'',province:'',city:'',zip:'',address:'',remark:'',items:[]};go('form')}
function example(){draft={shop:shops[0],name:'Grace Wilson',phone:'+1 202-555-0148',country:'美国',province:'California',city:'Los Angeles',zip:'90012',address:'128 Sample Street, Apt 3B',remark:'',items:[{sku:catalog[0].sku,qty:2,shipped:0}]};renderForm();toast('已填入示例，可继续批量添加商品')}
const addressFields=[['name','客户姓名'],['phone','手机号'],['country','国家'],['province','州 / 省'],['city','城市'],['zip','邮编'],['address','详细地址']];
function renderForm(){const control=(k)=>['country','province','city'].includes(k)?`<select id="${k}" onchange="changeRegion('${k}',this.value)" ${k==='province'&&!draft.country||k==='city'&&!draft.province?'disabled':''}>${opts(k==='country'?Object.keys(regions):k==='province'?Object.keys(regions[draft.country]||{}):(regions[draft.country]?.[draft.province]||[]),draft[k])}</select>`:`<input id="${k}" value="${esc(draft[k])}" oninput="draft.${k}=this.value" placeholder="${k==='phone'?'含国际区号':k==='address'?'街道、门牌号、公寓或楼层':'请输入'}" maxlength="${k==='address'?200:80}">`;
$('#main').innerHTML=`<div class="pagebar"><div class="pagetitle">新增销售订单 ${tag('香港 FOB-2C')}</div><div class="actions"><button class="link" onclick="example()">填入示例</button><button onclick="go('list')">返回</button><button class="primary" onclick="createOrder()">创建订单</button></div></div><div class="section"><div class="sectiontitle">订单信息 <small>销售订单新增入口 · 代发业务模式</small></div><div class="sectionbody"><div class="formgrid"><div class="field"><label for="shop" class="req">门店</label><div class="control"><select id="shop" onchange="draft.shop=this.value">${opts(shops,draft.shop,'请选择门店')}</select><div id="err-shop" class="error-text"></div></div></div><div class="field"><label>业务类型</label><input value="香港 FOB-2C" disabled></div><div class="field"><label>品牌</label><input value="VIVAIA" disabled></div></div></div></div><div class="section"><div class="sectiontitle">收件人信息</div><div class="sectionbody"><div class="formgrid">${addressFields.map(([k,t])=>`<div class="field ${k==='address'?'wide':''}"><label for="${k}" class="req">${t}</label><div class="control">${control(k)}<div id="err-${k}" class="error-text"></div></div></div>`).join('')}<div class="field wide"><label for="remark">订单备注</label><textarea id="remark" placeholder="选填" maxlength="500" oninput="draft.remark=this.value">${esc(draft.remark)}</textarea></div></div></div></div><div class="section"><div class="sectiontitle">订单商品 <button onclick="openProducts()">批量添加商品</button><small>支持一次选择多个 SKU，并分别设置数量</small></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>产品名称</th><th>属性</th><th class="num">销售单价(USD)</th><th>数量</th><th>操作</th></tr></thead><tbody>${draft.items.map((i,n)=>`<tr><td>${i.sku}</td><td>${product(i.sku).name}</td><td>${product(i.sku).attr}</td><td class="num">${money(product(i.sku).price)}</td><td><input type="number" aria-label="${i.sku}数量" min="1" max="9999" value="${i.qty}" oninput="draft.items[${n}].qty=Number(this.value);updateSummary()"></td><td><button class="link danger" onclick="draft.items.splice(${n},1);renderForm()">移除</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">请点击「批量添加商品」选择 SKU</td></tr>'}</tbody></table></div><div id="itemError" class="error-text" style="padding:10px 20px"></div><div class="sumrow" id="formSummary"></div></div><div class="notice">操作费在全部商品发货完成时自动计算；创建订单时不计费。销售金额由商品价格生成，物流费和操作费单独结算。</div>`;updateSummary()}
function updateSummary(){$('#formSummary').innerHTML=`<span>商品总数 <b>${quantity(draft)}</b></span><span>销售金额(USD) <b>${money(total(draft))}</b></span><span>操作费 <b>待发货完成</b></span>`}
function changeRegion(k,v){draft[k]=v;if(k==='country'){draft.province='';draft.city=''}if(k==='province')draft.city='';renderForm()}
function validate(o){let e={};[['shop','门店'],...addressFields].forEach(([k,l])=>{if(!String(o[k]||'').trim())e[k]='请选择或填写'+l});if(o.shop&&!shops.includes(o.shop))e.shop='门店无效或不在授权范围';if(o.country&&!regions[o.country])e.country='国家不在演示地址库';if(o.province&&!regions[o.country]?.[o.province])e.province='州省与国家不匹配';if(o.city&&!regions[o.country]?.[o.province]?.includes(o.city))e.city='城市与州省不匹配';if(o.phone&&!/^\+?[\d\s()-]{6,24}$/.test(o.phone))e.phone='手机号格式不正确';if(!o.items.length)e.items='请添加商品';o.items.forEach(i=>{if(!product(i.sku))e.items='SKU不存在：'+i.sku;else if(!Number.isInteger(i.qty)||i.qty<1||i.qty>9999)e.items='商品数量必须为1–9999的整数'});if(new Set(o.items.map(i=>i.sku)).size!==o.items.length)e.items='SKU重复，请合并数量';return e}
function allocate(o,source='DMS'){return {...clone(o),id:'SO-261012'+String(db.seq++).padStart(5,'0'),kind:'FOB_2C',status:1,shipping:0,freight:null,operation:null,created:now(),shipped:'',firstShipped:'',signed:'',tracking:'',source,payment:'—',bill:'',feeSnapshot:'',calculatedAt:'',version:1,logs:[{time:now(),text:source+'创建销售订单；待付款，操作费待发货完成计算'}]}}
function createOrder(){if(!can('edit'))return;const e=validate(draft);[['shop'],...addressFields].forEach(([k])=>$('#err-'+k).textContent=e[k]||'');$('#itemError').textContent=e.items||'';if(Object.keys(e).length)return toast('请检查订单信息','error');db.orders.unshift(allocate(draft));save();resetFilters();go('list');toast('销售订单已创建，订单状态为待付款')}
function openProducts(){productSelection=new Map();modal('批量添加商品',`<div style="display:flex;gap:10px;margin-bottom:14px"><input id="pq" aria-label="搜索商品" placeholder="搜索 SKU / 产品名称" style="width:300px" oninput="renderProductRows()"><span class="hint">重复添加已选 SKU 时合并数量</span></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="全选筛选商品" onchange="selectProducts(this.checked)"></th><th>SKU</th><th>产品名称 / 属性</th><th>单价(USD)</th><th>添加数量</th></tr></thead><tbody id="productRows"></tbody></table></div>`,`<span id="productCount" class="left">已选 0 个 SKU</span><button onclick="closeModal()">取消</button><button class="primary" onclick="addProducts()">添加已选商品</button>`,true);renderProductRows()}
function matchingProducts(){const q=$('#pq').value.toLowerCase();return catalog.filter(p=>(p.sku+p.name).toLowerCase().includes(q))}
function renderProductRows(){$('#productRows').innerHTML=matchingProducts().map(p=>`<tr><td><input type="checkbox" aria-label="选择商品 ${p.sku}" ${productSelection.has(p.sku)?'checked':''} onchange="this.checked?productSelection.set('${p.sku}',1):productSelection.delete('${p.sku}');renderProductRows()"></td><td>${p.sku}</td><td>${p.name}<small>${p.attr}</small></td><td>${money(p.price)}</td><td><input type="number" min="1" max="9999" aria-label="添加数量 ${p.sku}" value="${productSelection.get(p.sku)||1}" ${productSelection.has(p.sku)?'':'disabled'} oninput="productSelection.set('${p.sku}',Number(this.value))"></td></tr>`).join('')||'<tr><td colspan="5" class="empty">未找到商品</td></tr>';$('#productCount').textContent='已选 '+productSelection.size+' 个 SKU'}
function selectProducts(yes){matchingProducts().forEach(p=>yes?productSelection.set(p.sku,productSelection.get(p.sku)||1):productSelection.delete(p.sku));renderProductRows()}
function addProducts(){if(!productSelection.size)return toast('请选择商品','warn');for(const [sku,qty]of productSelection){const old=draft.items.find(i=>i.sku===sku);if(!Number.isInteger(qty)||qty<1||qty+(old?.qty||0)>9999)return toast('数量必须为正整数，合并后不能超过9999','error')}for(const [sku,qty]of productSelection){const old=draft.items.find(i=>i.sku===sku);old?old.qty+=qty:draft.items.push({sku,qty,shipped:0})}closeModal();renderForm();toast('已批量添加 '+productSelection.size+' 个 SKU')}
function openDetail(id,from='list'){returnView=from;detailTab='物流信息';go('detail',id)}
function renderDetail(){const o=db.orders.find(o=>o.id===activeId);if(!o)return go('list');const ds=o.kind==='FOB_2C';const feeValue=(value,pending)=>value===null?tag(pending,'orange'):money(value);const productRows=o.items.map(i=>`<tr><td>${i.sku}</td><td>${product(i.sku).name}<small>${product(i.sku).attr}</small></td><td class="num">${money(product(i.sku).price)}</td><td class="num">${i.qty}</td><td class="num">${i.shipped}</td></tr>`).join('');const feeSection=ds?`<div class="section"><div class="sectiontitle">费用明细 <span class="right muted">汇率：1 USD = ${FX_RATE.toFixed(2)} CNY</span></div><table><thead><tr><th>费用类型</th><th class="num">人民币金额(CNY)</th><th class="num">汇率(CNY/USD)</th><th class="num">美元金额(USD)</th></tr></thead><tbody><tr><td>物流费</td><td class="num">${o.freight===null?tag('待导入','orange'):money(o.freight*FX_RATE)}</td><td class="num">${FX_RATE.toFixed(2)}</td><td class="num">${feeValue(o.freight,'待导入')}</td></tr><tr><td>操作费</td><td class="num">${o.operation===null?tag('待计算','orange'):money(o.operation*FX_RATE)}</td><td class="num">${FX_RATE.toFixed(2)}</td><td class="num">${feeValue(o.operation,'待计算')}</td></tr>${o.freight!==null&&o.operation!==null?`<tr class="totalrow"><td>费用合计</td><td class="num money">${money((o.freight+o.operation)*FX_RATE)}</td><td class="num">—</td><td class="num money">${money(o.freight+o.operation)}</td></tr>`:''}</tbody></table></div>`:'';const detailContent=detailTab==='物流信息'?`<div class="infogrid">${kv('物流跟踪号',o.tracking||'—')+kv('首次发货时间',o.firstShipped||'—')+kv('发货完成时间',o.shipped||'—')+kv('签收时间',o.signed||'—')}</div>${trackingHTML(o)}`:`<ul class="historylist">${[...o.logs].reverse().map(l=>`<li><time>${l.time}</time>${esc(l.text)}</li>`).join('')}</ul>`;$('#main').innerHTML=`<div class="pagebar"><div class="pagetitle">${o.id} ${orderTag(o.status)} ${kindTag(o)}</div><div class="actions"><button onclick="${returnView==='bill'?`go('bill','${o.bill}')`:`go('list')`}">返回</button>${ds&&app==='DMS'?`<button ${can('fee')?'':'disabled'} onclick="openImport('fees')">导入物流费用</button><button onclick="openEvent('${o.id}')">模拟业务回传</button>`:''}</div></div><div class="section"><div class="sectiontitle">订单概况 <span class="right muted">销售订单 / 统一详情</span></div><div class="sectionbody"><div class="infogrid">${kv('门店',o.shop)+kv('订单来源',o.source)+kv('订单状态',STATUS[o.status])+kv('发货方式',ds?'线上':'门店')+kv('下单时间',o.created)+kv('发货状态',SHIP[o.shipping])+kv('支付方式',o.payment)+kv('销售金额(USD)',money(total(o)))}</div></div></div><div class="section"><div class="sectiontitle">客户及收件信息</div><div class="sectionbody"><div class="infogrid">${addressFields.map(([k,l])=>kv(l,o[k])).join('')+kv('订单备注',o.remark||'—')}</div></div></div><div class="section"><div class="sectiontitle">订单商品 <span class="right muted">发货进度 ${shipQty(o)} / ${quantity(o)} 件</span></div><table><thead><tr><th>SKU</th><th>产品名称 / 属性</th><th class="num">单价(USD)</th><th class="num">数量</th><th class="num">已发数量</th></tr></thead><tbody>${productRows}</tbody></table></div>${feeSection}<div class="section"><div class="subtabs">${['物流信息','操作日志'].map(t=>`<button class="${t===detailTab?'active':''}" onclick="detailTab='${t}';renderDetail()">${t}</button>`).join('')}</div><div class="sectionbody">${detailContent}</div></div>`}

function trackingHTML(o){if(!o.tracking)return '<div class="empty">暂无物流轨迹，等待仓库回传</div>';return `<div style="margin:20px 0;display:flex;justify-content:space-between"><span class="hint">模拟物流轨迹 · Shanghai UTC+08:00</span><button class="link" onclick="toast('演示轨迹已刷新')">刷新轨迹</button></div><ul class="timeline">${(o.signed?[[o.signed,'已签收','收件人已签收']]:[]).concat(o.shipped?[[o.shipped,'全部发货完成','订单商品已全部出库，操作费已计算']]:[],[[o.firstShipped,'已出库','包裹已交付承运商 · 香港'],[o.created,'订单信息已收到','等待履约']]).map(([t,s,d])=>`<li><time>${esc(t)}</time><strong>${s}</strong><p>${d}</p></li>`).join('')}</ul>`}
function openEvent(id){const o=db.orders.find(o=>o.id===id);modal('模拟业务回传',`<div class="notice">此处仅模拟已有支付与仓库接口的回传，不是生产操作。订单状态与发货状态独立。</div><div class="eventgrid"><div><b>支付回传</b><p class="hint">复用销售订单状态逻辑</p><button ${[1,5].includes(o.status)?'':'disabled'} onclick="eventApply('${id}','paid')">模拟支付完成 → 已完成</button></div><div><b>仓库回传</b><p class="hint">部分发货不计费，全部发货完成计费</p><button ${o.status===3&&o.shipping===0&&quantity(o)>1?'':'disabled'} onclick="eventApply('${id}','partial')">模拟部分发货</button> <button ${o.status===3&&o.shipping!==2?'':'disabled'} onclick="eventApply('${id}','shipped')">模拟全部发货完成</button></div><div><b>签收 / 重复回调</b><p class="hint">签收与回调重试不会重复计费</p><button ${o.shipping===2&&!o.signed?'':'disabled'} onclick="eventApply('${id}','signed')">模拟签收</button> <button ${o.shipping===2?'':'disabled'} onclick="eventApply('${id}','retry')">重放发货完成回调</button></div></div>`,`<button onclick="closeModal()">关闭</button>`)}
function eventApply(id,type){const o=db.orders.find(o=>o.id===id);if(type==='paid'){o.status=3;o.payment='银行卡';o.logs.push({time:now(),text:'模拟支付完成 → 已完成；发货状态仍为'+SHIP[o.shipping]})}if(type==='partial'){o.shipping=1;o.items[0].shipped=1;o.firstShipped=now();o.tracking='DEMO'+o.id.replace(/\D/g,'');o.logs.push({time:now(),text:'部分发货，操作费尚未计算'})}if(type==='shipped'||type==='retry'){if(o.shipping===2&&o.feeSnapshot){closeModal();return toast('重复发货回调已去重，操作费未重复计算')}o.shipping=2;o.items.forEach(i=>i.shipped=i.qty);o.firstShipped=o.firstShipped||now();o.shipped=now();o.tracking=o.tracking||'DEMO'+o.id.replace(/\D/g,'');o.operation=feeAmount(o);o.feeSnapshot='OF-V2-'+o.id;o.calculatedAt=now();o.logs.push({time:now(),text:'全部发货完成 → 自动计算操作费 '+money(o.operation)+' USD；保存计费快照'})}if(type==='signed'){o.signed=now();o.logs.push({time:now(),text:'物流签收回传；销售订单状态及已计算操作费保持不变'})}save();closeModal();renderDetail();toast('模拟回传已更新')}

function csvEncode(rows){return '\uFEFF'+rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}

function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(x==='"'){if(q&&t[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&t[i+1]==='\n')i++;r.push(c);if(r.some(x=>x.trim()))rows.push(r);r=[];c=''}else c+=x}if(q)throw Error('CSV引号未闭合');r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows.map(r=>r.map(v=>v.trim().replace(/^'(?=[+@=\-\d])/ ,'')))}

async function readImport(f){if(!f)return;if(!/\.csv$/i.test(f.name)||f.size>2*1024*1024)return toast('请上传2MB以内CSV文件','error');try{parseImport(parseCSV(await f.text()))}catch(e){toast(e.message,'error')}}
function parseImport(rows){const head=importMode==='orders'?orderHeaders:feeHeaders;importData=[];importErrors=[];importVersions={};if(!rows.length||rows[0].length!==head.length||head.some((h,i)=>rows[0][i]!==h))return toast('表头不匹配，请使用V2模板','error');if(rows.length<2||rows.length>501)return toast('文件应包含1–500行数据','error');importSig=JSON.stringify(rows);const error=(row,ref,message)=>importErrors.push({row,ref,message});if((importMode==='orders'?db.imports:db.feeImports).includes(importSig))error('整批','当前文件','相同文件已导入，已阻止重复执行');if(importMode==='orders'){const groups=new Map();rows.slice(1).forEach((r,n)=>{const [shop,name,phone,country,province,city,zip,address,sku,qty]=r;const o={shop,name,phone,country,province,city,zip,address,remark:'',items:[{sku,qty:Number(qty),shipped:0}]};if(r.length!==head.length)error(n+2,name||'—','列数不正确');Object.values(validate(o)).forEach(m=>error(n+2,name||'—',m));const key=groupKey({...o,name:name||'',phone:phone||''});if(groups.has(key)){const old=groups.get(key);if(['shop','country','province','city','zip','address'].some(k=>old[k]!==o[k]))error(n+2,name,'同一姓名＋手机号的门店或收件地址不一致');const item=old.items.find(i=>i.sku===sku);if(item){item.qty+=Number(qty);if(item.qty>9999)error(n+2,name,'同组SKU合并数量超过9999')}else old.items.push(...o.items)}else groups.set(key,o)});importData=[...groups.values()]}else{const seen=new Set();rows.slice(1).forEach((r,n)=>{const [id,value]=r,o=db.orders.find(o=>o.id===id);if(r.length!==2)error(n+2,id||'—','仅允许订单号、物流费用两列');if(!id)error(n+2,'—','订单号不能为空');if(seen.has(id))error(n+2,id,'同一文件订单号重复，请合并为一行');seen.add(id);if(!/^\d+(\.\d{1,2})?$/.test(value)||Number(value)>999999.99)error(n+2,id,'物流费用需为非负金额，最多2位小数');if(!o)error(n+2,id,'订单号不存在或无访问权限');else{if(o.kind!=='FOB_2C')error(n+2,id,'非香港 FOB-2C 订单，不适用代发物流费');if(o.bill)error(n+2,id,'已入账，费用不可覆盖');if([2,4].includes(o.status))error(n+2,id,'已取消 / 已售后订单不支持费用导入');importVersions[id]=o.version;importData.push({id,shop:o.shop,old:o.freight,value:Number(value),status:o.status})}})}r function resetDemo(){modal('重置 V2 演示数据','<p>清除V2中的演示变更并恢复初始数据。V1文件及其本地数据不受影响。</p>','<button onclick="closeModal()">取消</button><button class="primary" onclick="db=seed();save();closeModal();app=\'DMS\';resetFilters();go(\'list\');toast(\'V2已重置\')">确认重置</button>')}


const ERP_TYPES=['普通发货','备货发货','门店发货'];
let erpType='普通发货',erpPage=1,erpSize=10,erpFilters={},erpSelected=new Set(),erpTabState={};
const erpOrders=ERP_TYPES.flatMap((type,t)=>Array.from({length:[14,6,8][t]},(_,i)=>({
 id:`PK${['USA','STK','SHP'][t]}-261013${String(70-t*20-i).padStart(6,'0')}01`,
 order:`${t===2?'SO':'JXS'}-261013${String(70-t*20-i).padStart(5,'0')}`,type,
 customer:t===2?['香港中环店','香港尖沙咀店','香港铜锣湾店'][i%3]:['李冰月经销商','直营经销模式检查'][i%2],
 region:['美利坚合众国','香港','英国'][i%3],skuCount:1+i%3,qty:1+i%6,
 category:t===1?'期货订单':t===2?'销售订单':'补货订单',status:['待发货','待发货','已完成','已提货'][i%4],
 entity:i%3===2?'深圳科技':'香港科技',warehouse:t===2?'香港仓':i%3===1?'直营门店仓01':'kwt',boxes:i%4<2?0:1+i%2,
 transport:['陆运','海运','空运'][i%3],created:`2026-10-13 ${String(16-Math.floor(i/4)).padStart(2,'0')}:${String(55-i*3).padStart(2,'0')}:26`,
 completed:i%4>=2?'2026-10-13 17:11:44':'',picked:i%4===3?'2026-10-13 17:48:18':'',batch:i%4===3?`DTH261013${String(i+t*20).padStart(6,'0')}`:'',
 creator:'李冰月',sku:catalog[i%catalog.length].sku,upc:`690261013${String(t*20+i).padStart(4,'0')}`
})));
function erpShell(){document.body.classList.toggle('erp-mode',app==='ERP');$('#erpSwitch').classList.toggle('active',app==='ERP');if(app!=='ERP')return;
 $('#sideSystem').textContent='ERP 企业资源管理';$('#nav').innerHTML=['PLM','产品管理','店铺商品','版房管理','面料管理','开发管理','采购需求管理','KA订单管理','订单管理','售后工单','供应商协同','采购管理','物流管理','质检管理'].map(n=>`<div class="erp-navgroup"><span>♧</span>${n}<small>⌄</small></div>`).join('')+`<div class="erp-navgroup"><span>♧</span>仓库管理<small>⌃</small></div><div class="erp-navgroup erp-child">○　包裹列表</div><div class="erp-navgroup erp-child">○　库存管理</div><div class="erp-navgroup erp-child">○　收货管理</div><div class="erp-navgroup erp-child">○　PDA</div><div class="erp-navgroup erp-child">○　经销商发货管理<small>⌃</small></div><button class="navitem active" onclick="go('erp')">发货单列表</button>`;$('#topTab').textContent=view==='plan'?'V2 方案说明':'首页 / 仓库管理 / 经销商发货管理 / 发货单列表';}

function erpRows(){return erpOrders.filter(o=>o.type===erpType&&Object.entries(erpFilters).every(([k,v])=>!v||(k==='start'?o.created.slice(0,10)>=v:k==='end'?o.created.slice(0,10)<=v:k==='pickStart'?o.picked.slice(0,10)>=v:k==='pickEnd'?Boolean(o.picked)&&o.picked.slice(0,10)<=v:['status','transport','region','entity'].includes(k)?o[k]===v:String(o[k]||'').toLowerCase().includes(v.toLowerCase()))));}
function erpField(label,k,values){return `<label class="erp-field"><span>${label}：</span>${values?`<select aria-label="ERP${label}" data-erp-filter="${k}">${opts(values,erpFilters[k]||'','请选择')}</select>`:`<input aria-label="ERP${label}" data-erp-filter="${k}" value="${esc(erpFilters[k]||'')}" placeholder="请输入${label}" onkeydown="if(event.key==='Enter')erpSearch()">`}</label>`;}
function erpDate(label,start,end){return `<label class="erp-field"><span>${label}：</span><div class="erp-dates"><input type="date" aria-label="ERP${label}开始日期" data-erp-filter="${start}" value="${erpFilters[start]||''}"><span>—</span><input type="date" aria-label="ERP${label}结束日期" data-erp-filter="${end}" value="${erpFilters[end]||''}"></div></label>`;}
function erpSearch(){const next={};document.querySelectorAll('[data-erp-filter]').forEach(e=>next[e.dataset.erpFilter]=e.value.trim());if((next.start&&next.end&&next.start>next.end)||(next.pickStart&&next.pickEnd&&next.pickStart>next.pickEnd))return toast('开始日期不能晚于结束日期','error');erpFilters=next;erpPage=1;erpSelected.clear();renderERP();}
function erpChangeType(type){if(!ERP_TYPES.includes(type))return;erpTabState[erpType]={filters:{...erpFilters},page:erpPage};erpType=type;const state=erpTabState[type];erpFilters={...(state?.filters||{})};erpPage=state?.page||1;erpSelected.clear();renderERP();document.querySelector('.erp-tabs [aria-selected="true"]').focus();}
function erpTabKey(event,type){const i=ERP_TYPES.indexOf(type);let next;if(event.key==='ArrowRight')next=(i+1)%3;else if(event.key==='ArrowLeft')next=(i+2)%3;else if(event.key==='Home')next=0;else if(event.key==='End')next=2;else return;event.preventDefault();erpChangeType(ERP_TYPES[next]);}
function erpToggle(id,checked){checked?erpSelected.add(id):erpSelected.delete(id);renderERP();}
function renderERP(){const rows=erpRows(),pages=Math.max(1,Math.ceil(rows.length/erpSize));erpPage=Math.min(erpPage,pages);const visible=rows.slice((erpPage-1)*erpSize,erpPage*erpSize);$('#main').innerHTML=`

 <div class="erp-filter"><div class="erp-filtergrid">${erpField('发货单状态','status',['待发货','已完成','已提货'])+erpField('运输方式','transport',['陆运','海运','空运'])+erpField('发货单号','id')+erpField('订单号','order')+erpField('客户名称','customer')+erpField('创建人','creator')+erpField('SKU','sku')+erpField('UPC','upc')+erpDate('创建时间','start','end')+erpDate('提货时间','pickStart','pickEnd')+erpField('签约地区','region',['美利坚合众国','香港','英国'])+erpField('主体归属','entity',['香港科技','深圳科技'])+erpField('提货批次','batch')}</div><div class="erp-search"><button class="primary" onclick="erpSearch()">搜索</button><button class="erp-reset" onclick="erpFilters={};erpPage=1;erpSelected.clear();renderERP()">重置</button></div></div>
 <div class="erp-tablepanel"><div class="erp-toolbar"><select aria-label="ERP批量操作" onchange="if(this.value==='export')erpExport(true);this.value='' "><option value="">批量操作 ⌄</option><option value="export">导出选中发货单</option></select><button onclick="erpExport(false)">导出列表</button><span>${erpSelected.size?'已选择 '+erpSelected.size+' 条':''}</span></div> <div class="erp-tabs" role="tablist" aria-label="发货类型">${ERP_TYPES.map(t=>`<button role="tab" id="erp-tab-${ERP_TYPES.indexOf(t)}" aria-controls="erp-tab-panel" tabindex="${erpType===t?0:-1}" onkeydown="erpTabKey(event,'${t}')" aria-selected="${erpType===t}" class="${erpType===t?'active':''}" onclick="erpChangeType('${t}')">${t}</button>`).join('')}</div>
 <div id="erp-tab-panel" role="tabpanel" aria-labelledby="erp-tab-${ERP_TYPES.indexOf(erpType)}"><div class="tablewrap"><table class="erp-table"><thead><tr><th><input type="checkbox" aria-label="选择本页全部发货单" ${visible.length&&visible.every(o=>erpSelected.has(o.id))?'checked':''} onchange="erpSelectPage(this.checked)"></th>${['发货单号','订单单号','客户名称','客户签约地区','SKU种类数','订单类型','发货数量','发货单状态','主体归属','采购仓库','箱数','运输方式','发货类型','下单时间','发货完成时间','提货时间','提货批次','创建人'].map(t=>`<th>${t}</th>`).join('')}<th class="sticky">操作</th></tr></thead><tbody>${visible.map(o=>`<tr class="${erpSelected.has(o.id)?'selected':''}"><td><input type="checkbox" aria-label="选择 ${o.id}" ${erpSelected.has(o.id)?'checked':''} onchange="erpToggle('${o.id}',this.checked)"></td><td>${o.id}</td><td>${o.order}</td><td>${o.customer}</td><td>${o.region}</td><td>${o.skuCount}</td><td>${o.category}</td><td>${o.qty}</td><td>${o.status}</td><td>${o.entity}</td><td>${o.warehouse}</td><td>${o.boxes}</td><td>${o.transport}</td><td>${o.type}</td><td>${o.created}</td><td>${o.completed||'-'}</td><td>${o.picked||'-'}</td><td>${o.batch||'-'}</td><td>${o.creator}</td><td class="sticky"><button class="link" onclick="erpDetail('${o.id}')">详情</button></td></tr>`).join('')||'<tr><td colspan="20" class="empty">暂无符合条件的发货单</td></tr>'}</tbody></table></div><div class="erp-pagination"><button aria-label="ERP上一页" ${erpPage===1?'disabled':''} onclick="erpPage--;renderERP()">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${erpPage===i+1?'active':''}" onclick="erpPage=${i+1};renderERP()">${i+1}</button>`).join('')}<button aria-label="ERP下一页" ${erpPage===pages?'disabled':''} onclick="erpPage++;renderERP()">›</button><span>共 ${rows.length} 条</span><select aria-label="ERP每页条数" onchange="erpSize=Number(this.value);erpPage=1;renderERP()">${[10,20,50].map(n=>`<option value="${n}" ${erpSize===n?'selected':''}>${n}条/页</option>`).join('')}</select></div></div></div>`;}
function erpSelectPage(checked){erpRows().slice((erpPage-1)*erpSize,erpPage*erpSize).forEach(o=>checked?erpSelected.add(o.id):erpSelected.delete(o.id));renderERP();}
function erpDetail(id){const o=erpOrders.find(o=>o.id===id);modal('发货单详情',`<div class="infogrid">${[['发货单号',o.id],['订单号',o.order],['发货类型',o.type],['发货单状态',o.status],['客户名称',o.customer],['客户签约地区',o.region],['主体归属',o.entity],['采购仓库',o.warehouse],['运输方式',o.transport],['SKU种类数',o.skuCount],['发货数量',o.qty],['箱数',o.boxes],['下单时间',o.created],['发货完成时间',o.completed||'-'],['提货时间',o.picked||'-'],['提货批次',o.batch||'-'],['创建人',o.creator]].map(([k,v])=>kv(k,v)).join('')}</div>`,`<button onclick="closeModal()">关闭</button>`,true);}
function erpExport(selected){const rows=erpRows().filter(o=>!selected||erpSelected.has(o.id));if(!rows.length)return toast(selected?'请先选择发货单':'没有可导出的发货单','warn');download('ERP-'+erpType+'-发货单.csv',csvEncode([['发货单号','订单号','客户名称','签约地区','SKU种类数','订单类型','发货数量','发货单状态','主体归属','采购仓库','箱数','运输方式','发货类型','下单时间','发货完成时间','提货时间','提货批次','创建人'],...rows.map(o=>[o.id,o.order,o.customer,o.region,o.skuCount,o.category,o.qty,o.status,o.entity,o.warehouse,o.boxes,o.transport,o.type,o.created,o.completed,o.picked,o.batch,o.creator])]));toast('已导出 '+rows.length+' 条发货单');}

save();render();</script></body></html>
