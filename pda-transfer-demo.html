<section id="demo" class="screenview active"><div class="mobilecontrol"><button onclick="go('home')">工作台</button><button onclick="start('create')">创建</button><button onclick="start('ship')">发货</button><button onclick="start('receive')">收货</button><button onclick="openRole()">切换角色</button><button onclick="$('inspector').scrollIntoView({behavior:'smooth'})">模拟扫码</button><button onclick="resetDemo()">重置</button></div><div class="workspace"><aside class="rail"><div><div class="eyebrow">Transfer operations</div><h2>PDA 调拨作业</h2><p>从门店出库，到目标仓入库。<br>一套熟悉的扫码体验。</p></div><div><div class="rail-label">作业场景</div><button class="scenario" data-scene="home" onclick="go('home')"><span class="num">⌂</span><span><b>工作台</b><small>WORKBENCH</small></span></button><button class="scenario" data-scene="create" onclick="start('create')"><span class="num">01</span><span><b>创建调拨</b><small>CREATE & SHIP</small></span></button><button class="scenario" data-scene="ship" onclick="start('ship')"><span class="num">02</span><span><b>调拨发货</b><small>TRANSFER SHIPPING</small></span></button><button class="scenario" data-scene="receive" onclick="start('receive')"><span class="num">03</span><span><b>调拨收货</b><small>TRANSFER RECEIVING</small></span></button></div><div><div class="rail-label">当前作业身份</div><select id="roleSelect" aria-label="作业身份" onchange="changeRole(this.value)"><option value="store">直营门店 · Soho</option><option value="dealer">经销商门店 · Soho</option><option value="warehouse">经销商总仓 · US</option></select><p style="margin-top:10px">门店可创建、发货、收货。<br>总仓仅显示调拨收货。</p></div><div class="rail-foot"><p>本地交互原型 · 演示数据<br>不连接真实业务接口</p><button class="textbtn" onclick="resetDemo()" style="margin-top:10px">重置演示数据 ↺</button></div></aside><main class="stage"><div class="stagebar"><b id="stageTitle">WORKBENCH</b><span>PDA · 自适应预览</span></div><div class="device" id="device"><div class="statusbar"><span>11:18</span><span class="statusicons">▂▄▆　⌁　▰ 65</span></div><div class="phonehead" id="phonehead"></div><div class="phonebody" id="phonebody"></div><div class="phonefooter" id="phonefooter"></div><div class="gesture"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></div><div class="stagecaption">继承现有 PDA 组件 · 大触控区 · 单手扫码作业</div></main><aside class="inspector" id="inspector"></aside></div></section>
<section id="plan" class="screenview"><div class="report" id="report"></div></section>
<section id="sources" class="screenview"><div class="report" id="sourcesReport"></div></section>
<script>
'use strict';
const icons={back:'<path d="m14 5-7 7 7 7M7 12h14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',store:'<path d="M4 10v11h16V10M3 3h18l1 7c-1 3-4 3-5 0-1 3-4 3-5 0-1 3-4 3-5 0-1 3-4 3-5 0l1-7Z"/><path d="M9 3 8 10m7-7 1 7M9 21v-7h6v7"/>',warehouse:'<path d="m3 9 9-6 9 6v12H3ZM7 21V11h10v10M7 15h10m-10 3h10"/>',pin:'<path d="M12 22s8-9 8-14a8 8 0 0 0-16 0c0 5 8 14 8 14Z"/><circle cx="12" cy="8" r="2"/>',plus:'<path d="M12 4v16M4 12h16"/>',box:'<path d="m3 7 9-4 9 4v11l-9 4-9-4ZM3 7l9 4 9-4M12 11v11M7 5l10 4"/>',ship:'<path d="M3 5h12v12H3Zm12 5h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',receive:'<path d="M3 13v8h18v-8M12 2v13m-5-5 5 5 5-5"/>',scan:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 7v10m3-10v10m4-10v10m3-10v10"/>',rfid:'<path d="M5 4a12 12 0 0 0 0 16m14-16a12 12 0 0 1 0 16M8 7a8 8 0 0 0 0 10m8-10a8 8 0 0 1 0 10"/><circle cx="12" cy="12" r="1.5"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',check:'<path d="m5 12 4 4L20 5"/>',circlecheck:'<circle cx="12" cy="12" r="10"/><path d="m7 12 3 3 7-7"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v.1"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/>',swap:'<path d="M3 7h18l-4-4M21 17H3l4 4"/>',settings:'<path d="m12 2 2 3 4-1 1 4 3 2-2 3 1 4-4 1-2 3-3-2-4 1-1-4-3-2 2-3-1-4 4-1Z"/><circle cx="12" cy="12" r="3"/>',clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2m-7 9 3 3 6-7"/>',minus:'<path d="M5 12h14"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.box}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const products=[{id:'s1',sku:'sharacc2605210001001',upc:'194879260101',name:'SERAPHINE',color:'SILVER',size:'one-size',series:'SERAPHINE BLACK',stock:24},{id:'s2',sku:'shflat2608010002002',upc:'194879260202',name:'MARGOT',color:'BLACK',size:'EU 38',series:'SQUARE-TOE FLATS',stock:18},{id:'s3',sku:'shflat2608010003003',upc:'194879260303',name:'ARIA',color:'CREAM',size:'EU 37',series:'POINTED-TOE FLATS',stock:12},{id:'s4',sku:'shflat2608010004004',upc:'194879260404',name:'TAMIA',color:'BROWN',size:'EU 39',series:'WALKING FLATS',stock:0}];
const warehouses={soho:{id:'101',name:'VIVAIA New York Soho',short:'Soho 门店仓',type:'门店仓',address:'68 Prince St, New York, NY'},boston:{id:'102',name:'VIVAIA Boston',short:'Boston 门店仓',type:'门店仓',address:'100 Huntington Ave, Boston, MA'},la:{id:'103',name:'VIVAIA Los Angeles',short:'Los Angeles 门店仓',type:'门店仓',address:'10250 Santa Monica Blvd, Los Angeles, CA'},us:{id:'201',name:'US Central Warehouse',short:'US 经销商总仓',type:'总仓',address:'New Jersey, US'}};
const statusNames={0:'待调拨',1:'已拒绝',2:'待入库',3:'部分入库',4:'已完成',5:'已作废'};
const line=(id,req,ship=0,received=0,short=0)=>({id,req,ship,received,short});
function seed(){return [{code:'D261010001',source:'soho',target:'boston',status:0,lines:[line('s1',3),line('s2',2),line('s3',1)],remark:'秋季陈列补货',time:'2026-10-10 09:30',logs:['DMS 创建调拨单，等待调出门店发货']},{code:'D261010002',source:'soho',target:'us',status:0,lines:[line('s1',2),line('s2',2)],remark:'门店退回总仓',time:'2026-10-10 09:10',logs:['DMS 创建调拨单，等待调出门店发货']},{code:'D261009003',source:'boston',target:'soho',status:2,lines:[line('s1',3,3),line('s2',2,2),line('s3',1,1)],remark:'日常调拨补货',time:'2026-10-09 16:40',logs:['Boston 门店已发货 6 件']},{code:'D261009004',source:'la',target:'soho',status:3,lines:[line('s1',4,4,2),line('s2',3,3,1)],remark:'分批到货',time:'2026-10-09 15:10',logs:['Los Angeles 门店已发货 7 件','已入库 3 件，剩余可收 4 件']},{code:'D261009005',source:'boston',target:'us',status:2,lines:[line('s1',3,3),line('s2',2,2),line('s3',1,1)],remark:'回仓整理',time:'2026-10-09 14:30',logs:['Boston 门店已发货 6 件']},{code:'D261009006',source:'la',target:'us',status:3,lines:[line('s1',4,4,1,1),line('s2',3,3,1)],remark:'已登记少货 1 件，待后台确认',time:'2026-10-09 12:00',logs:['已入库 2 件；少货预扣 1 件（待确认）']},{code:'D261008007',source:'soho',target:'la',status:1,lines:[line('s1',2)],remark:'',rejectReason:'商品无法按期调出',time:'2026-10-08 15:00',logs:['调出门店拒绝：商品无法按期调出']}];}
let db;try{db=JSON.parse(localStorage.getItem('vivaia-transfer-demo-v1'));}catch{}if(!db?.orders)db={orders:seed(),stocks:Object.fromEntries(products.map(p=>[p.id,p.stock])),next:10};
let state={role:'store',screen:'home',scene:'home',order:null,counts:{},epcs:{},target:'',remark:'',mode:'barcode',scanning:false,tab:'unscanned',listTab:'pending',query:'',failure:'normal',error:'',receiptCode:'',uncertain:null,sessionReceived:0,result:null};
let toastTimer,modalAction,scanTimer,lastRenderKey;
function save(){try{localStorage.setItem('vivaia-transfer-demo-v1',JSON.stringify(db));}catch{}}
function currentWarehouse(){return state.role==='warehouse'?'us':'soho'}
function order(){return db.orders.find(o=>o.code===state.order)}
function prod(id){return products.find(p=>p.id===id)}
function totalCounts(){return Object.values(state.counts).reduce((a,b)=>a+b,0)}
function sum(o,key){return o.lines.reduce((a,l)=>a+l[key],0)}
function remain(l){return Math.max(0,l.ship-l.received-l.short)}
function badge(status){return `<span class="badge ${status===1?'red':status===4?'green':status===3?'dark':''}">${statusNames[status]}</span>`}
function stopScan(){state.scanning=false;clearInterval(scanTimer)}
function fresh(){stopScan();state.counts={};state.epcs={};state.error='';state.tab='unscanned';state.receiptCode='';state.uncertain=null;state.sessionReceived=0;state.query='';state.listTab='pending';state.result=null;state.failure='normal'}
function guard(action){if(state.uncertain){toast('请先核对上次提交结果，再离开作业',true);return}if(state.screen==='detail'&&totalCounts()>0){modalAction=()=>{closeSheet();action()};sheet('离开当前作业？','<p>本次未提交的扫描数量将被清除。已经成功入库的数量会保留。</p>',`<button class="btn outline" onclick="closeSheet()">继续作业</button><button class="btn" onclick="modalAction()">确认离开</button>`)}else action()}
function go(where){guard(()=>{fresh();state.screen=where;state.scene=where==='home'?'home':state.scene;render()})}
function start(scene){if(state.role==='warehouse'&&scene!=='receive'){toast('总仓端仅支持调拨收货',true);return}guard(()=>{fresh();state.scene=scene;state.screen=scene==='create'?'detail':'list';state.order=null;state.target='';state.remark='';render()})}
function changeRole(role){guard(()=>{fresh();state.role=role;state.scene='home';state.screen='home';closeSheet();render()});$('roleSelect').value=state.role}
function openRole(){sheet('切换作业身份',`<p>将按角色展示对应作业入口。</p>${[['store','直营门店 · New York Soho'],['dealer','经销商门店 · New York Soho'],['warehouse','经销商总仓 · US']].map(([v,n])=>`<button class="warehouseoption" onclick="changeRole('${v}')">${n}</button>`).join('')}`)}
function resetDemo(){modalAction=()=>{db={orders:seed(),stocks:Object.fromEntries(products.map(p=>[p.id,p.stock])),next:10};save();fresh();state.screen='home';state.scene='home';closeSheet();render();toast('演示数据已重置')};sheet('重置演示数据？','<p>清除本地演示产生的单据和扫描数量，恢复所有示例场景。</p>',`<button class="btn outline" onclick="closeSheet()">取消</button><button class="btn" onclick="modalAction()">重置</button>`)}
function openOrder(code,scene=state.scene){const o=db.orders.find(o=>o.code===code);if(!o)return toast('未找到调拨单，请检查单号',true);if(scene==='receive'&&o.target!==currentWarehouse())return toast('调入仓库不是当前作业仓库',true);if(scene==='ship'&&(state.role==='warehouse'||o.source!==currentWarehouse()))return toast('当前门店不是调出仓库',true);fresh();state.scene=scene;state.order=code;state.screen=(scene==='ship'?o.status!==0:![2,3].includes(o.status))?'record':'detail';render()}
function switchView(v){document.querySelectorAll('.screenview').forEach(el=>el.classList.toggle('active',el.id===v));document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===v));if(v!=='demo')stopScan();window.scrollTo(0,0)}
function setListTab(t){state.listTab=t;render()}
function toast(text,error=false){clearTimeout(toastTimer);$('toast').innerHTML=`<div class="toast ${error?'error':''}">${icon(error?'alert':'circlecheck')}<span>${esc(text)}</span></div>`;toastTimer=setTimeout(()=>$('toast').innerHTML='',3500)}
function sheet(title,body,actions=''){stopScan();clearTimeout(toastTimer);$('toast').innerHTML='';if(state.screen==='detail')render();$('overlay').innerHTML=`<div class="modal-layer"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="flex between"><h2>${title}</h2><button class="iconbtn" aria-label="关闭" onclick="closeSheet()">${icon('close')}</button></div>${body}${actions?`<div class="sheetactions">${actions}</div>`:''}</section></div>`;setTimeout(()=>$('overlay').querySelector('input,textarea,button')?.focus(),30)}
function closeSheet(){if(state.screen==='processing')return;$('overlay').innerHTML='';if(state.screen==='detail')render()}
function head(title,sub='',back=true){$('phonehead').innerHTML=`${back?`<button class="iconbtn" aria-label="返回" onclick="back()">${icon('back')}</button>`:icon('store')}<div class="grow"><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div>${!back?`<button class="iconbtn" aria-label="切换身份" onclick="openRole()">${icon('settings')}</button>`:''}`}
function back(){if(state.screen==='list'||state.screen==='record')go('home');else if(state.scene==='create')go('home');else guard(()=>{fresh();state.screen='list';render()})}
function render(){const body=$('phonebody'),key=state.screen+':'+state.scene+':'+state.order,old=key===lastRenderKey?body.scrollTop:0;lastRenderKey=key;body.classList.toggle('receiving',['detail','processing'].includes(state.screen));$('roleSelect').value=state.role;document.querySelectorAll('[data-scene]').forEach(el=>{el.classList.toggle('active',el.dataset.scene===state.scene);el.disabled=state.role==='warehouse'&&['create','ship'].includes(el.dataset.scene)});$('stageTitle').textContent=({home:'WORKBENCH',create:'01 / CREATE & SHIP',ship:'02 / TRANSFER SHIPPING',receive:'03 / TRANSFER RECEIVING'})[state.scene];$('phonefooter').style.display='none';if(state.screen==='home')renderHome();else if(state.screen==='list')renderList();else if(state.screen==='detail')renderDetail();else if(state.screen==='success')renderSuccess();else if(state.screen==='record')renderRecord();renderInspector();body.scrollTop=old}
function footer(html){$('phonefooter').style.display='block';$('phonefooter').innerHTML=html}
function renderHome(){head('工作台','Workbench',false);const wh=warehouses[currentWarehouse()];$('phonebody').innerHTML=`<button class="pcard homecard opcard" onclick="openRole()"><div class="flex"><span class="blockicon">${icon(state.role==='warehouse'?'warehouse':'pin')}</span><div class="grow"><p style="margin-top:0;font-size:11px">当前${state.role==='warehouse'?'总仓':'门店'}</p><h3>${wh.name}</h3></div>${icon('down')}</div></button><div class="context"><span class="dot"></span>${state.role==='warehouse'?'经销商总仓':state.role==='dealer'?'经销商门店':'直营门店'} · ${wh.short}</div><button class="pcard homecard opcard" onclick="toast('采购 / 补货收货为已有功能，本 Demo 聚焦调拨作业')"><div class="flex"><span class="blockicon">${icon('box')}</span><div><h3>${state.role==='dealer'?'补货收货':'采购收货'}</h3><p>Scan inbound goods</p></div><span class="arrow">${icon('arrow')}</span></div></button><div class="home-section flex between"><span>调拨作业</span><small class="muted" style="font-size:10px;font-weight:400">TRANSFER</small></div>${state.role!=='warehouse'?`<div class="grid2"><button class="pcard opcard" onclick="start('create')"><span class="blockicon">${icon('plus')}</span><h3>创建调拨</h3><p>扫码建单并出库</p></button><button class="pcard opcard" onclick="start('ship')"><span class="blockicon">${icon('ship')}</span><h3>调拨发货 <small class="badge">${db.orders.filter(o=>o.status===0&&o.source===currentWarehouse()).length}</small></h3><p>处理待调拨单据</p></button></div>`:''}<button class="pcard homecard opcard" style="margin-top:13px" onclick="start('receive')"><div class="flex"><span class="blockicon">${icon('receive')}</span><div><h3>调拨收货</h3><p>扫描调拨单号，核对入库</p></div><span class="arrow">${icon('arrow')}</span></div></button><div class="home-section">常用作业</div><div class="grid2">${[['clip','库存盘点'],['search','找货']].map(([i,n])=>`<button class="pcard opcard" onclick="toast('${n}为已有功能，本 Demo 聚焦调拨作业')"><span class="blockicon">${icon(i)}</span><h3>${n}</h3></button>`).join('')}</div>`}
function eligibleOrders(){return db.orders.filter(o=>state.scene==='ship'?o.source===currentWarehouse():o.target===currentWarehouse()).filter(o=>state.listTab==='history'?(state.scene==='ship'?o.status!==0:![2,3].includes(o.status)):(state.scene==='ship'?o.status===0:[2,3].includes(o.status))).filter(o=>!state.query||o.code.toLowerCase().includes(state.query.toLowerCase()))}
function renderList(){head(state.scene==='ship'?'调拨发货':'调拨收货');$('phonebody').innerHTML=`<div class="context">${icon('pin')}${warehouses[currentWarehouse()].short}</div><button class="btn full" onclick="openOrderScan()">${icon('scan')} 扫描调拨单号</button><div class="searchbox">${icon('search')}<input id="searchOrder" placeholder="搜索调拨单号" value="${esc(state.query)}" oninput="state.query=this.value;renderOrderCards()" onkeydown="if(event.key==='Enter')lookupOrder(this.value)"></div><div class="listtabs"><button class="${state.listTab==='pending'?'active':''}" onclick="setListTab('pending')">${state.scene==='ship'?'待调拨':'待收货'}</button><button class="${state.listTab==='history'?'active':''}" onclick="setListTab('history')">已处理</button></div><div id="orderCards"></div>`;renderOrderCards()}
function renderOrderCards(){const list=eligibleOrders();$('orderCards').innerHTML=list.length?list.map(o=>{const ship=state.scene==='ship';return `<article class="pcard ordercard"><div class="flex between"><div><small class="muted">调拨单</small><div class="ordercode mono">${o.code}</div></div>${badge(o.status)}</div><div class="route"><span class="muted">调出</span>　<b>${warehouses[o.source].short}</b><br><span class="muted">调入</span>　<b>${warehouses[o.target].short}</b></div><div class="meta">${ship?'创建':'发货'}时间 ${o.time}</div><div class="stats">${stat(ship?'需求数量':'发货数量',sum(o,ship?'req':'ship'))}${stat(ship?'已发货':'已入库',sum(o,ship?'ship':'received'))}${stat('SKU',o.lines.length)}</div>${o.lines.some(l=>l.short)?'<div class="notice">含少货预扣，按剩余可收数量作业</div>':''}<button class="btn full ${state.listTab==='history'?'outline':''}" onclick="openOrder('${o.code}')">${icon(state.listTab==='history'?'search':ship?'ship':'receive')}${state.listTab==='history'?'查看记录':ship?'开始调拨':'开始收货'}</button></article>`}).join(''):`<div class="empty">${icon('box')}<b>暂无${state.listTab==='history'?'已处理单据':'待处理单据'}</b>${state.query?'请检查单号，或清除搜索条件':'当前仓库没有符合条件的调拨单'}</div>`}
function stat(label,num,color=''){return `<div class="stat"><small>${label}</small><strong class="${color}">${num}</strong></div>`}
function openOrderScan(){sheet('扫描 / 输入调拨单号',`<p>扫描单据条码，或手动输入调拨单号。</p><input id="orderInput" placeholder="例如 ${state.role==='warehouse'?'D261009005':state.scene==='ship'?'D261010001':'D261009003'}" onkeydown="if(event.key==='Enter')lookupOrder(this.value)"><p class="meta">仅打开当前仓库有权处理的单据。</p>`,`<button class="btn full" onclick="lookupOrder($('orderInput').value)">${icon('search')}查找单据</button>`)}
function lookupOrder(raw){const code=raw.trim().toUpperCase().replace(/^G6380-/,'');if(!code)return toast('请输入调拨单号',true);const o=db.orders.find(o=>o.code===code);if(!o)return toast('未找到调拨单，请检查单号',true);if(state.scene==='receive'&&o.target!==currentWarehouse())return toast('调入仓库不是当前作业仓库',true);if(state.scene==='ship'&&(o.source!==currentWarehouse()||state.role==='warehouse'))return toast('当前门店不是调出仓库',true);if(state.scene==='ship'&&o.status!==0)return toast('该单不是待调拨状态，请在已处理查看',true);if(state.scene==='receive'&&![2,3].includes(o.status))return toast(`该单${statusNames[o.status]}，不可收货`,true);closeSheet();openOrder(code)}
function detailLines(){return state.scene==='create'?products.filter(p=>state.counts[p.id]>0).map(p=>({id:p.id,req:0,ship:0,received:0,short:0})):order().lines.filter(l=>state.scene!=='receive'||remain(l)>0||(state.counts[l.id]||0)>0)}
function renderDetail(){const create=state.scene==='create',ship=state.scene==='ship',o=order();head(create?'创建调拨':ship?'调拨发货':'调拨收货');let top=create?`<div class="pcard flat"><label class="fieldlabel">调出仓库</label><div class="fixedfield"><span>${warehouses[currentWarehouse()].short}</span>${icon('lock')}</div><div class="fieldgap"><label class="fieldlabel">调入仓库 <span class="red">*</span></label><button class="selectfield" onclick="selectWarehouse()"><span class="${state.target?'':'muted'}">${state.target?warehouses[state.target].short:'请选择调入仓库'}</span>${icon('down')}</button></div>${state.target?`<div class="line-note">${icon('pin')} ${warehouses[state.target].address}</div>`:''}</div>`:`<div class="pcard flat"><div class="flex between"><div><small class="muted">当前调拨单号</small><div class="ordercode mono">${o.code}</div></div>${badge(o.status)}</div><div class="route" style="margin-bottom:0">${warehouses[o.source].short} ${icon('arrow')} ${warehouses[o.target].short}</div></div>`;
let metrics=create?stat('已扫描',totalCounts())+stat('SKU',detailLines().length)+stat('调出仓',1):ship?stat('需求数量',sum(o,'req'))+stat('已扫描',totalCounts(),totalCounts()?'green':'red')+stat('待匹配',o.lines.reduce((a,l)=>a+Math.max(0,l.req-(state.counts[l.id]||0)),0)):stat('发货数量',sum(o,'ship'))+stat('剩余可收',o.lines.reduce((a,l)=>a+remain(l),0),'green')+stat('本次扫描',totalCounts(),totalCounts()?'green':'red');
$('phonebody').innerHTML=top+`<div class="stats">${metrics}</div>${!create&&!ship?`<div class="meta" style="margin:0 2px 12px">历史已入库 ${sum(o,'received')} 件${sum(o,'short')?' · 少货预扣 '+sum(o,'short')+' 件':''}</div>`:''}${state.error?`<div class="notice error">${esc(state.error)}</div>`:''}${scanBox()}${!create&&ship&&o.remark?`<div class="notice">备注：${esc(o.remark)}</div>`:''}${renderSkuList()}${create?`<div class="pcard flat" style="margin-top:13px"><label class="fieldlabel" for="remark">备注 <span class="muted" style="font-weight:400">选填</span></label><textarea id="remark" rows="2" maxlength="120" placeholder="填写调拨说明，最多 120 字" oninput="state.remark=this.value">${esc(state.remark)}</textarea></div>`:''}`;
footer(`<div class="toolbar-note">${create?'提交后立即出库，单据进入待入库':ship?'按本次扫描数量出库，提交后不可继续发货':'扫描仅暂存 · 点击确认后入库'}</div><div class="footrow">${ship?`<button class="btn outline" onclick="rejectOrder()">拒绝调拨</button>`:`<button class="btn outline" onclick="back()">${icon('back')}返回</button>`}<button class="btn" onclick="confirmSubmit()" ${totalCounts()===0||state.uncertain?'disabled':''}>${icon('circlecheck')}${create?'提交并出库':ship?'确认出库':'确认收货'}</button></div>${state.uncertain?`<button class="textbtn" style="display:block;margin:8px auto 0" onclick="reconcile()">刷新并核对提交结果</button>`:''}`)}
function scanBox(){return `<div class="scanbox ${state.scanning?'scanactive':''}"><div class="flex"><div class="blockicon">${icon(state.mode==='rfid'?'rfid':'scan')}</div><div><small>当前模式</small><h3>${state.mode==='rfid'?(state.scanning?'RFID 扫描中':'RFID 已停止'):'条码扫描'}</h3></div><button class="switch" onclick="toggleMode()">切换</button></div>${state.mode==='barcode'?`<div class="scanrow"><input id="scanInput" aria-label="商品 SKU 或 UPC" placeholder="扫描或输入 SKU / UPC" onkeydown="if(event.key==='Enter'){scan(this.value);this.value=''}" ${state.uncertain?'disabled':''}><button aria-label="录入商品" onclick="scan($('scanInput').value);if($('scanInput'))$('scanInput').value=''" ${state.uncertain?'disabled':''}>${icon('arrow')}</button></div><div class="rfidline"><span class="dot"></span>条码就绪 · 每次扫描计入 1 件</div>`:`<div class="rfidline"><span class="dot"></span>RFID 在线 · 同一 EPC 自动去重</div><button class="btn ${state.scanning?'outline':'soft'} full small" style="margin-top:12px" onclick="toggleRfid()" ${state.uncertain?'disabled':''}>${state.scanning?'停止扫描':'开始扫描'}</button>`}</div>`}
function renderSkuList(){const all=detailLines(),matched=all.filter(l=>(state.counts[l.id]||0)>0),unmatched=all.filter(l=>(state.counts[l.id]||0)===0);const filtered=state.scene==='create'?all:state.tab==='scanned'?matched:unmatched;return `<div class="pcard details flat"><div class="flex between sectionline"><span>商品明细</span><small class="muted">${all.length} SKUs</small></div>${state.scene==='create'?'':`<div class="tabs"><button class="${state.tab==='scanned'?'active':''}" onclick="state.tab='scanned';render()">已扫描 (${matched.length})</button><button class="${state.tab==='unscanned'?'active':''}" onclick="state.tab='unscanned';render()">未扫描 (${unmatched.length})</button></div>`}<div class="subtotal"><span>${state.scene==='create'?'本次调拨':'本次扫描'}合计</span><b>${totalCounts()} 件</b></div>${filtered.length?filtered.map(l=>{const p=prod(l.id),n=state.counts[l.id]||0,den=state.scene==='ship'?l.req:remain(l);return `<div class="skurow"><div class="flex between"><div><h3>${p.name}</h3><div class="skucode">SKU ${p.sku}</div></div><button class="quantity qtybutton ${n>0?'green':''}" aria-label="调整 ${p.name} 数量" onclick="editQuantity('${p.id}')">${n}${state.scene==='create'?'':`<span>/${den}</span>`}</button></div><div class="attributes"><span>${p.color}</span><span>${p.size}</span><span>${p.series}</span></div><div class="line-note" style="display:flex;justify-content:space-between;gap:8px"><span>${state.scene==='create'?'当前可用库存 '+db.stocks[p.id]+' 件':state.scene==='ship'?'需求 '+l.req+' 件 · 扫描 '+n+' 件':(l.short?'少货预扣 '+l.short:'')}</span><span>点击数量调整</span></div></div>`}).join(''):`<div class="empty">${icon('scan')}<b>${state.scene==='create'?'扫描第一件商品':'暂无商品'}</b>${state.scene==='create'?'支持 SKU / UPC，重复扫描自动累加':'切换分类，或继续扫描商品'}</div>`}</div>`}
function selectWarehouse(){sheet('选择调入仓库',`<div class="searchbox">${icon('search')}<input placeholder="搜索仓库名称" oninput="document.querySelectorAll('.warehouseoption[data-name]').forEach(e=>e.hidden=!e.dataset.name.toLowerCase().includes(this.value.toLowerCase()))"></div>${Object.entries(warehouses).filter(([k])=>k!==currentWarehouse()).map(([k,w])=>`<button class="warehouseoption ${state.target===k?'selected':''}" data-name="${w.name} ${w.short}" onclick="state.target='${k}';closeSheet();render()"><div class="flex between"><b>${w.short}</b><span class="badge">${w.type}</span></div><small>${w.address}</small></button>`).join('')}`)}
function toggleMode(){stopScan();state.mode=state.mode==='barcode'?'rfid':'barcode';render()}
function toggleRfid(){state.scanning=!state.scanning;render();if(state.scanning)toast('RFID 已启动，可在右侧模拟标签读取')}
function scan(raw,epc=null){if(state.screen!=='detail')return toast('请先进入创建或单据作业页',true);if(state.uncertain)return toast('请先核对上次提交结果',true);let code=String(raw).trim().replace(/^G6380-/i,'');if(!code)return toast('请输入 SKU / UPC',true);if(epc){if(!state.scanning||state.mode!=='rfid')return toast('请先切换 RFID 并开始扫描',true);if(state.epcs[epc])return toast('重复 EPC 已忽略，数量未增加')}
const p=products.find(p=>p.sku.toLowerCase()===code.toLowerCase()||p.upc.replace(/^0+/,'')===code.replace(/^0+/,''));if(!p)return toast('无法识别商品编码，未计入数量',true);if(state.scene!=='create'&&!order().lines.some(l=>l.id===p.id))return toast('该商品不在当前调拨单中',true);const next=(state.counts[p.id]||0)+1;if(!setQuantity(p.id,next))return;if(epc)state.epcs[epc]=p.id;state.error='';render();if(!epc)$('scanInput')?.focus();toast(`${p.name} +1 · 本次已扫描 ${totalCounts()} 件`)}
function setQuantity(id,n){if(!Number.isSafeInteger(n)||n<0||n>999999){toast('请输入 0～999999 的整数',true);return false}const p=prod(id);if(state.scene==='receive'){const l=order().lines.find(l=>l.id===id);if(n>remain(l)){toast(`超过可收数量，${p.name} 最多可收 ${remain(l)} 件`,true);return false}}else if(n>db.stocks[id]){toast(`库存不足，${p.name} 当前可用 ${db.stocks[id]} 件`,true);return false}state.counts[id]=n;if(n===0)Object.keys(state.epcs).filter(e=>state.epcs[e]===id).forEach(e=>delete state.epcs[e]);return true}
function editQuantity(id){if(state.uncertain)return toast('请先核对上次提交结果',true);const p=prod(id);sheet('调整本次扫描数量',`<p><b>${p.name}</b> · ${p.color} · ${p.size}</p><input id="quantityInput" aria-label="本次数量" type="number" min="0" max="999999" step="1" value="${state.counts[id]||0}"><p>输入 0 可清除该 SKU 本次扫描；历史已入库数量不会改变。</p>`,`<button class="btn outline" onclick="closeSheet()">取消</button><button class="btn" onclick="const v=$('quantityInput').value;if(v===''||!/^\\d+$/.test(v)){toast('请输入非负整数',true)}else if(setQuantity('${id}',Number(v))){closeSheet();render()}">保存</button>`)}
function sampleScan(id){scan(prod(id).upc,state.mode==='rfid'?'EPC-'+id+'-'+Date.now():null)}
function fillScans(){if(state.screen!=='detail')return toast('请先打开作业页面',true);if(state.uncertain)return toast('请先核对上次提交结果',true);const lines=state.scene==='create'?products.slice(0,3).map((p,i)=>({id:p.id,req:3-i})):order().lines;for(const l of lines){const n=state.scene==='receive'?remain(l):Math.min(l.req,db.stocks[l.id]);if(n>0)setQuantity(l.id,n)}render();toast('已模拟扫描当前单据商品')}
function confirmSubmit(){if(!totalCounts())return toast('请先扫描商品',true);if(state.scene==='create'&&!state.target)return toast('请选择调入仓库',true);if(state.uncertain)return;stopScan();const o=order(),create=state.scene==='create',ship=state.scene==='ship';let mismatch=ship&&o.lines.some(l=>(state.counts[l.id]||0)!==l.req);sheet(create?'确认创建并出库':ship?'确认调拨出库':'确认调拨收货',`<p>${create?'提交后创建调拨单，并立即扣减当前门店库存。':ship?'提交后按实际扫描数量出库，单据进入待入库。':'仅提交本次扫描数量，成功后增加当前仓可用库存。'}</p>${mismatch?`<div class="notice">扫描 ${totalCounts()} 件 / 需求 ${sum(o,'req')} 件。数量不一致；本次发货完成后，未发数量不会保留为待发货任务。</div>`:''}<div class="summaryrow"><span>调出仓库</span><b>${warehouses[create?currentWarehouse():o.source].short}</b></div><div class="summaryrow"><span>调入仓库</span><b>${warehouses[create?state.target:o.target].short}</b></div><div class="summaryrow"><span>本次数量</span><b>${totalCounts()} 件 / ${Object.values(state.counts).filter(n=>n>0).length} SKU</b></div>${!create&&!ship&&totalCounts()<o.lines.reduce((a,l)=>a+remain(l),0)?'<div class="notice">本次为部分收货，剩余商品可稍后继续入库。</div>':''}`,`<button class="btn outline" onclick="closeSheet()">继续扫描</button><button class="btn" onclick="submit()">${create||ship?'确认出库':'确认收货'}</button>`)}
function rejectOrder(){sheet('拒绝调拨',`<p>拒绝后该单不可继续发货，不产生库存变化。</p><label class="fieldlabel" for="rejectReason">拒绝原因 <span class="red">*</span></label><textarea id="rejectReason" placeholder="请填写拒绝原因" rows="4"></textarea>`,`<button class="btn outline" onclick="closeSheet()">取消</button><button class="btn danger" onclick="commitReject()">确认拒绝</button>`)}
function commitReject(){const reason=$('rejectReason').value.trim();if(!reason)return toast('请填写拒绝原因',true);const o=order();if(o.status!==0)return toast('单据状态已变化，请刷新',true);o.status=1;o.rejectReason=reason;o.logs.push('拒绝调拨：'+reason);save();state.counts={};state.result={title:'已拒绝调拨',note:'单据已结束，不产生库存变动。',quantity:0};closeSheet();state.screen='success';render()}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function submit(){if(state.screen==='processing')return;const scene=state.scene,counts={...state.counts},qty=totalCounts(),o=order();state.screen='processing';$('overlay').innerHTML='';$('phonefooter').innerHTML='<div class="toolbar-note">正在处理，请勿退出或重复提交</div>';renderProcessing(0,Object.values(counts).filter(n=>n>0).length);await delay(550);
if(state.failure==='stock'&&scene!=='receive'){state.screen='detail';state.error='提交失败：库存已变化，请刷新库存并重新核对。本次扫描数量已保留。';state.failure='normal';render();return}
if(scene==='create'){const no='D261010'+String(db.next++).padStart(3,'0');const newOrder={code:no,source:currentWarehouse(),target:state.target,status:2,lines:products.filter(p=>counts[p.id]>0).map(p=>line(p.id,counts[p.id],counts[p.id])),remark:state.remark,time:'2026-10-10 11:18',logs:[`门店创建并出库 ${qty} 件` ]};for(const l of newOrder.lines)db.stocks[l.id]-=l.ship;db.orders.unshift(newOrder);state.order=no;state.result={title:'创建并出库成功',note:'调拨单已创建，等待调入仓库收货。',quantity:qty};}
else if(scene==='ship'){if(o.status!==0){state.screen='detail';state.error='单据状态已变化，请返回列表刷新';render();return}for(const l of o.lines){l.ship=counts[l.id]||0;db.stocks[l.id]-=l.ship}o.status=2;o.logs.push(`门店调拨出库 ${qty} 件`);state.result={title:'调拨出库成功',note:'商品已出库，等待调入仓库收货。',quantity:qty};}
else{const entries=Object.entries(counts).filter(([,n])=>n>0);if(!state.receiptCode)state.receiptCode='DEMO-IN-'+String(db.next++).padStart(4,'0');let done=0;for(const [id,n] of entries){await delay(400);if(state.failure==='partial'&&done===1){state.failure='normal';state.screen='detail';state.error=`部分提交成功：${done} 个 SKU 已入库。下一项业务校验失败，未入库数量已保留，请修正后继续提交。`;save();render();return}if(state.failure==='uncertain'&&done===0){state.failure='normal';state.uncertain={id,n,before:order().lines.find(l=>l.id===id).received,applied:true};applyReceipt(id,n);state.screen='detail';state.error='请求超时，当前 SKU 入库结果待核对。请先刷新核对；核对前已暂停扫码和再次提交。';save();render();return}applyReceipt(id,n);state.counts[id]=0;done++;renderProcessing(done,entries.length);save()}
state.result={title:'本次收货成功',note:order().status===4?'全部商品已入库，调拨完成。':order().lines.some(l=>remain(l)>0)?'本次商品已入库，剩余可收商品可继续收货。':'可收商品已入库，少货仍待后台确认，单据保持部分入库。',quantity:qty,receiptCode:state.receiptCode};}
save();state.counts={};state.error='';state.screen='success';render()}
function renderProcessing(done,total){$('phonebody').innerHTML=`<div class="processing successhero"><div class="spinner"></div><h2>正在${state.scene==='receive'?'入库':'出库'}</h2><p>正在处理本次扫描数量，请稍候</p>${state.scene==='receive'?`<div class="progress"><div style="width:${done/total*100}%"></div></div><p>已确认 ${done} / ${total} SKU</p>`:''}</div>`;renderInspector()}
function applyReceipt(id,n){const o=order(),l=o.lines.find(l=>l.id===id);l.received+=n;state.sessionReceived+=n;const complete=o.lines.every(l=>l.received===l.ship);o.status=complete?4:3;if(o.target==='soho')db.stocks[id]+=n;o.logs.push(`${prod(id).name} 入库 ${n} 件 · ${state.receiptCode}`)}
function reconcile(){const u=state.uncertain;if(!u)return;const l=order().lines.find(l=>l.id===u.id);const delta=l.received-u.before;sheet('提交结果核对',`<p>刷新后的单据与入库明细显示：</p><div class="summaryrow"><span>${prod(u.id).name}</span><b>本次已入库 ${delta} 件</b></div><div class="summaryrow"><span>入库记录</span><b>${state.receiptCode}</b></div><div class="notice">演示场景：请求已在服务端成功，响应丢失。确认后移除已入库数量，不重复提交。生产环境须核对对应入库记录，不能仅凭数量差推断。</div>`,`<button class="btn full" onclick="state.counts[state.uncertain.id]=0;state.uncertain=null;state.error='核对完成：已入库数量已从待提交中移除。';closeSheet();render()">已核对，继续作业</button>`)}
function renderSuccess(){const o=order(),r=state.result;head('操作结果');$('phonebody').innerHTML=`<div class="successhero"><div class="successmark" style="${o.status===1?'background:#f0ede9;color:#555':''}">${icon(o.status===1?'close':'check')}</div><h2>${r.title}</h2><p>${r.note}</p>${badge(o.status)}</div><div class="pcard flat"><div class="flex between"><small class="muted">调拨单号</small><b class="mono">${o.code}</b></div><div class="route"><span class="muted">调出</span>　${warehouses[o.source].short}<br><span class="muted">调入</span>　${warehouses[o.target].short}</div>${o.status===1?`<div class="notice">拒绝原因：${esc(o.rejectReason)}</div>`:`<div class="stats">${stat('本次'+(state.scene==='receive'?'入库':'出库'),r.quantity)}${stat('累计发货',sum(o,'ship'))}${stat('累计入库',sum(o,'received'))}</div>`}${r.receiptCode?`<div class="meta">演示入库单号 ${r.receiptCode}</div>`:''}</div><div class="pcard flat"><h3 style="margin-bottom:20px">操作记录</h3><div class="timeline">${o.logs.map(x=>`<div>${esc(x)}<small>演示操作记录</small></div>`).join('')}</div></div>${state.scene==='create'&&o.target==='us'?`<div class="notice">可切换到总仓身份，继续演示此单的调拨收货。</div>`:''}`;footer(`<div class="footrow"><button class="btn outline" onclick="go('home')">返回工作台</button><button class="btn" onclick="${state.scene==='receive'&&o.status===3&&o.lines.some(l=>remain(l)>0)?`openOrder('${o.code}','receive')`:state.scene==='create'?`start('create')`:`start('${state.scene}')`}">${state.scene==='receive'&&o.status===3&&o.lines.some(l=>remain(l)>0)?'继续收货':state.scene==='create'?'继续创建':'返回列表'}</button></div>`)}
function renderRecord(){const o=order();head('调拨记录');$('phonebody').innerHTML=`<div class="pcard"><div class="flex between"><b class="mono">${o.code}</b>${badge(o.status)}</div><div class="route">${warehouses[o.source].short} ${icon('arrow')} ${warehouses[o.target].short}</div><div class="stats">${stat('需求',sum(o,'req'))}${stat('发货',sum(o,'ship'))}${stat('入库',sum(o,'received'))}</div>${o.rejectReason?`<div class="notice">拒绝原因：${esc(o.rejectReason)}</div>`:''}</div><div class="pcard"><h3 style="margin-bottom:18px">操作记录</h3><div class="timeline">${o.logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`;footer('<button class="btn outline full" onclick="back()">返回工作台</button>')}

y('s1',db.stocks.s1+1)}" ${!active?'disabled':''}>超量测试</button></div><label for="failureSelect">提交结果模拟</label><select id="failureSelect" onchange="state.failure=this.value" ${!active?'disabled':''}>${(scene==='receive'?[['normal','正常提交'],['partial','第二个 SKU 业务失败'],['uncertain','响应丢失 · 结果待核对']]:[['normal','正常提交'],['stock','提交时库存变化']]).map(([v,l])=>`<option value="${v}" ${state.failure===v?'selected':''}>${l}</option>`).join('')}</select>${scene==='receive'?'<p style="margin-top:9px;font-size:10px">中途失败场景需扫描至少 2 个 SKU。成功项保留，未成功项继续处理。</p>':''}</div><div class="divider"></div><div><div class="eyebrow">Business rule</div><p style="margin-top:10px">${scene==='create'?'创建接口在调出门店等于当前登录门店时，直接建单并扣减库存。无需再次调用发货接口。':scene==='ship'?'扫描数量可以与需求不一致；按实际数量一次发货。后端校验可用库存，未发部分不会留在待调拨。':scene==='receive'?'可收 = 发货 − 已收 − 少货预扣。扫描不改库存，确认后才入库；调拨多 SKU 提交需逐项确认结果。':'沿用现有暖白底、黑色主按钮、圆角卡片和固定底部操作。系统方案页提供完整接口映射。'}</p><button class="textbtn" style="margin-top:10px" onclick="switchView('plan')">查看系统方案 ↗</button></div>`}

function makeReport(){return `<div class="reporthero"><div><div class="eyebrow">System proposal / based on master</div><h1>调拨作业，在 PDA 上闭环。</h1><p>保留现有后端库存和状态流转，在现有 Android 扫码工作流上增加创建、发货、收货入口。HTML 演示运行于本地，所有数量与单号为示例，不调用真实接口。</p></div><span class="badge green">方案 / 交互已覆盖</span></div><nav class="reportnav"><a href="#architecture">现有架构</a><a href="#flows">业务流程</a><a href="#contract">接口映射</a><a href="#scanRules">扫码规则</a><a href="#gaps">落地差异</a><a href="#acceptance">验收场景</a></nav>
<div id="architecture" class="reportsection"><h2>01 / 现有架构与相关模块</h2><div class="reportgrid"><article class="reportcard"><div class="eyebrow">Backend</div><h3>同一调拨领域服务</h3><p>Java 21 · Spring Boot 3.2.5 · MyBatis。<br>dms-webapi 提供 shop / tenant 双入口；dms-core 保存订单、库存、入库单和日志；dms-job 为任务模块。</p><p style="margin-top:12px"><code>ShopTransferOrderServiceImpl</code><br>创建、发货、拒绝、作废。<br><code>ShopReceiptServiceImpl</code><br>门店调拨收货、在途转可用。</p></article><article class="reportcard"><div class="eyebrow">Web / DMS + POS</div><h3>双前端，共享业务语义</h3><p>pnpm / Turbo 多包工程，Vue 3 + Vite + Element Plus。DMS 位于 packages/drp，POS 位于 packages/pos。</p><p style="margin-top:12px">DMS：pos/transferOrder 创建与详情。<br>POS：stock/transferOrder 创建、发货、拒绝；restock/receipt/TransferGoodsReceipt 按 SKU / 整单收货。</p></article><article class="reportcard"><div class="eyebrow">Android / PDA</div><h3>原生 Compose 分层</h3><p>单 Activity，Navigation 3、Koin、Ktor、Room。Feature ViewModel 依赖 Repository 接口，经 impl / Mapper 桥接网络层。</p><p style="margin-top:12px">角色：STORE / DEALER / WAREHOUSE。现有采购、补货收货和总仓补货发货可供复用；经销商首页调拨入口仍处于注释占位。</p></article></div><div class="flow" style="margin-top:17px"><b>页面 / ViewModel</b> → <b>Repository 接口</b> → <b>impl + Mapper</b> → <b>Ktor 网络 API</b> → <b>shop / tenant Controller</b> → <b>领域服务 / 库存 / 日志</b></div><p style="margin-top:16px"><span class="tag">已核实</span>PDA 目前未检索到完整调拨 Repository / Network API / 作业页面。新增工作应沿用当前分层，而不是把 Web 页面嵌入 PDA。</p></div>
<div id="flows" class="reportsection"><h2>02 / 角色、入口与状态</h2><table><thead><tr><th>角色</th><th>创建调拨</th><th>调拨发货 / 拒绝</th><th>调拨收货</th></tr></thead><tbody><tr><td>直营门店 / 经销商门店</td><td>允许，调出固定当前门店仓</td><td>当前门店调出的待调拨单</td><td>调入当前门店仓的待入库 / 部分入库单</td></tr><tr><td>经销商总仓</td><td>不展示入口</td><td>不展示入口</td><td>调入当前总仓的待入库 / 部分入库单</td></tr></tbody></table><p style="margin-top:14px">工作台新增「调拨作业」区域。角色只决定功能范围；最终还须通过现有账号功能权限和仓库上下文校验。Demo 角色切换用于演示，不代表生产权限控制。</p><div class="flow"><b>门店扫码创建</b> → <b>待入库 2</b> → <b>部分入库 3</b> → <b>已完成 4</b></div><div class="flow" style="margin-top:10px"><b>已有待调拨 0</b> → <b>发货 → 待入库 2</b><span>或</span><b>拒绝 → 已拒绝 1</b></div><p style="margin-top:13px">已作废 5 属于已有后台能力，不加入本次 PDA 作业入口。全部收齐可由待入库直接转已完成，不必经过部分入库。</p><table><thead><tr><th>作业</th><th>页面设计</th><th>后端业务结果</th></tr></thead><tbody><tr><td>创建调拨</td><td>固定调出仓 → 选择调入仓 → 扫码累计 → 确认摘要 → 提交并出库</td><td>当前登录 shopId 等于调出仓所属 shopId 时，createShippedOrder 直接生成待入库单；同一创建事务内完成出库和调入在途增加。不要再调用 ship。</td></tr><tr><td>调拨发货</td><td>待调拨列表 → 单据详情 → SKU / UPC 匹配 → 实际数量确认 → 发货；拒绝原因弹层为次操作</td><td>0 → 2；本次正数量商品出库。允许少发 / 多于需求数发货，仍受库存约束；一次发货结束待调拨阶段，不存在“部分发货”状态。</td></tr><tr><td>调拨收货</td><td>扫码 / 输入单号 → 锁定当前单 → 本地累计 → 确认 → 提交结果 / 继续收货</td><td>只提交本次增量；可部分收货。实际收货 + 已确认少货 = 发货量时完成，否则部分入库。待确认少货占用可收数量，但不能直接当作已确认完成。</td></tr></tbody></table><div class="notice"><b>库存口径：</b>出库时，调出仓 availableQty 与 inventoryQty 减少；调入仓 inventoryQty 和 allotInTransitQty 增加。收货时，在途转为可用。页面的“已扫描”仅是本次暂存，不表示库存已发生变化。</div></div>
<div id="contract" class="reportsection"><h2>03 / 现有接口与提交契约</h2><p>以下路径已在 Controller 与 Web API 调用中核对。均为业务路径，部署网关前缀沿用现有 Ktor 配置。查询和写入按登录身份调用 shop 或 tenant 入口，不以接口名称相似为依据混用业务域。</p><table><thead><tr><th style="width:14%">能力</th><th style="width:32%">现有接口</th><th style="width:27%">关键参数</th><th>使用说明</th></tr></thead><tbody>${apiRows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===1||i===2?'<code>'+c+'</code>':c}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="notice"><b>成功判断：</b>创建可能返回 success=true，但 data.failSkuList 非空，此时没有建单成功。必须展示逐 SKU 失败原因并保留扫描。只有返回有效 orderCode / orderId 才进入成功页。发货 / 拒绝应在成功响应后重新获取状态；收货必须保存返回的入库单号。</div><details><summary style="cursor:pointer;font-size:13px">查看本方案收货提交编排</summary><pre>1. 确认收货 → 停止 RFID / 条码累计 → 冻结本次扫描快照。
2. 重新核对目标仓、单据状态和最新 canReceiptQuantity。
3. 按 SKU 顺序调用对应 /transfer-order/create-by-sku。
4. 首项成功保存返回的入库单号；后续携带 orderCode。
5. 每项明确成功后从待提交队列移除，并刷新已入库 / 可收数量。
6. 明确业务失败 → 停止队列，保留失败和未处理项；允许修正后继续。
7. 超时 / 断网且结果未知 → 暂停重试，核对入库明细与日志。
8. 所有项确认成功才显示“本次收货成功”，状态以服务端为准。

注意：多个 SKU 是多个独立事务；已成功项不能由 PDA 回滚。
分布式锁只防并发，不等于幂等；orderCode 是入库单归并键，不是请求幂等键。</pre></details></div>
<div id="scanRules" class="reportsection"><h2>04 / 扫码、数量和交互规则</h2><div class="reportgrid"><article class="reportcard"><h3>条码 + RFID</h3><p>复用 ScanInputController、EpcDecoder 与扫码反馈。硬件条码按现有规则移除 G6380- 前缀；SKU / UPC 映射至标准 SKU 后计数。连续扫同一条码每次 +1；RFID 以 EPC 去重，同 SKU 不同 EPC 正常累加。</p></article><article class="reportcard"><h3>本次扫描独立计数</h3><p>创建按库存上限检查；发货按实际数量填写，不强制等于需求；收货上限使用服务端 canReceiptQuantity。未匹配商品、超量不计数，清晰提示。数值编辑仅改本次数量，不能改变历史已收。</p></article><article class="reportcard"><h3>操作中断与恢复</h3><p>提交前停止读取；提交中禁用操作；离开未提交页面二次确认。扫码状态放 ViewModel，角色 / 仓库 / 单号切换时隔离。生产扫描草稿建议按用户、仓库、单号存本地并在恢复前重新校验。</p></article></div><table style="margin-top:18px"><thead><tr><th>场景</th><th>处理</th><th>依据类型</th></tr></thead><tbody><tr><td>未选调入仓、空商品、无效数量</td><td>禁止提交；数量使用非负整数编辑，0 清空扫描；请求仅含正数量行。</td><td>已有契约 + PDA 交互</td></tr><tr><td>发货实际数量与需求不同</td><td>确认弹层列出差异并解释：本次提交后整单进入待入库。</td><td>已有后端行为；新增明确提示</td></tr><tr><td>收货超量 / 单外商品</td><td>不累计，提示单号或可收数量；不能把超量商品并入本次正常收货。</td><td>已有 Web 和服务端校验</td></tr><tr><td>扫描标签重复</td><td>沿用 RfidEpcSessionTracker：已接受 EPC 会话内去重，拒绝标签短期限流；清空某 SKU 时释放其 EPC。</td><td>已有 PDA 能力</td></tr><tr><td>少货异常</td><td>展示已有少货预扣，使用服务端剩余可收；Demo 不新增异常登记入口，后台继续确认差异。</td><td>本次范围 + 现有字段</td></tr><tr><td>接口状态 / 库存变化</td><td>保留未提交扫描并刷新，显示服务端错误。库存最终以写接口事务校验为准。</td><td>已有约束 + 新增反馈</td></tr><tr><td>断网 / 请求结果未知</td><td>不自动重放写请求，先核对入库明细；无法唯一确认时留待人工处理。新增幂等批量接口后可安全重试。</td><td>新增编排规则</td></tr></tbody></table><p style="margin-top:16px">视觉依据：PDA 的 Color.kt（#FCF9F5 暖白底）及 PurchaseReceivingContent.kt（#F4F0EF 作业底、黑色主按钮、绿色正常数量 / 红色待扫描数量），结合三张用户截图。Demo 使用中文业务文案，保持原截图卡片、统计块、扫码区、明细分类、固定操作条的布局；生产新增文案需同步中英文资源。</p></div>
<div id="gaps" class="reportsection"><h2>05 / 复用范围与必须明确的差异</h2><p>以下是从当前 master 得出的落地边界；本次仅设计演示，不更改任何业务源码。标为“建议新增”的内容不代表当前接口已具备。</p><table><thead><tr><th style="width:19%">事项</th><th style="width:41%">当前代码事实</th><th>方案决策</th></tr></thead><tbody><tr><td><span class="tag">可复用</span>创建与出库</td><td>create() 按调出仓所属 shopId 与当前 user.shopId 判断是否直接出库。</td><td>PDA 锁定当前门店仓，单次 create 完成建单与出库；对 failSkuList 保留明细反馈。</td></tr><tr><td><span class="tag proposed">PDA 新增</span>调拨模块</td><td>现有 PDA 有采购 / 补货收货、扫码解码、角色 API；调拨入口只见注释占位。</td><td>新增 TransferRepository / DTO / 网络契约及对应 ViewModel、Screen、导航；沿用分层、Koin、DataState、EventChannel。</td></tr><tr><td><span class="tag proposed">关键差异</span>多 SKU 收货</td><td>调拨 Controller 只有单 SKU / 整单。通用 tenant/create-by-batch-sku 仅分发 ALLOT_ORDER / PURCHASE_ORDER，不支持 SHOP_TRANSFER_ORDER；补货批量也不是门店调拨接口。</td><td>本 Demo 采用顺序调用现有调拨单 SKU 接口，展示部分成功。若要求一次确认全部原子提交，建议新增调拨专用批量能力，复用现有库存计算并增加事务及幂等请求键。</td></tr><tr><td><span class="tag proposed">契约补强</span>仓库 ID</td><td>ListVO / DetailVO 及详情 SQL 未返回 sourceWarehouseId、targetWarehouseId；await/list 仅返回单号与 skuList。</td><td>现阶段先用 currentWarehouseId + orderCodes 列表查询限定范围，再取明细。建议列表 / 详情补充仓库 ID，便于提交前稳定校验；不能用仓库名代替 ID。</td></tr><tr><td><span class="tag proposed">服务端核验</span>发货 / 拒绝范围</td><td>service ship / reject 锁定租户与单据状态，方法体未显式比较当前 shopId 和调出 shopId。Web 用门店名称控制按钮。</td><td>PDA 用仓库筛选定位单据；生产后端应补当前门店与调出方的一致性检查，按钮隐藏不能替代服务端权限。</td></tr><tr><td><span class="tag proposed">服务端核验</span>收货状态与总仓</td><td>getAndCheckTransferOrder 验证目标门店 / 非门店目标和可收数量，未显式只允许 2/3；tenant 调用不接收当前 warehouseId。</td><td>扫码前用 statuses:[2,3]、targetWarehouseIds 限定；生产建议服务端补状态白名单及当前总仓授权验证，避免只依赖客户端。</td></tr><tr><td><span class="tag proposed">建议新增</span>写入幂等与草稿</td><td>现有调拨收货分布式锁不提供请求幂等；创建直接出库分支需专项核对库存锁定约束（与 ship 的 locked 检查不同）。</td><td>写请求关闭自动重放；未知结果核对后处理。建议后端补幂等请求键、创建锁定库存一致校验；扫描草稿与业务数据分开存储。</td></tr></tbody></table><div class="notice"><b>权限接入：</b>门店创建 / 发货 / 拒绝沿用 INVENTORY_MANAGEMENT_TRANSFER_EDIT，列表和详情沿用 TRANSFER_VIEW / RECEIVING_PENDING_VIEW，收货沿用 INVENTORY_RECEIVING_RECEIVING_OPERATE。总仓收货沿用 WMS_RECEIVING_OPS_VIEW，列表 / 详情沿用 SHOP_TRANSFER_VIEW / WMS_RECEIVING_PENDING_VIEW。登录账号实际授权需联调核验。</div><details><summary style="cursor:pointer;font-size:13px">建议新增模块结构（仅方案，不写入项目）</summary><pre>feature/main/impl/.../page/transfer/

<div id="acceptance" class="reportsection"><h2>06 / 可在 Demo 中直接验收</h2><table><thead><tr><th>路径</th><th>操作</th><th>预期结果</th></tr></thead><tbody><tr><td>创建 → 总仓收货</td><td>门店创建，调入 US 总仓，扫描商品并出库；切换总仓角色，找到新单收货。</td><td>创建直接待入库；新单出现在总仓待收列表；全部收齐后已完成。</td></tr><tr><td>按单发货</td><td>打开 D261010001，扫描一组商品，确认出库。</td><td>0 → 2，移入已处理记录，扣减演示门店库存。</td></tr><tr><td>不足量发货</td><td>只扫 1 件后提交。</td><td>差异二次确认；按实发数量出库，未发需求不再留待调拨。</td></tr><tr><td>拒绝调拨</td><td>打开待调拨单，拒绝原因留空 / 填写后提交。</td><td>空原因阻止；有原因转已拒绝，不产生库存变化。</td></tr><tr><td>部分 / 全部收货</td><td>打开 D261009003，先收 1 件，再继续收完。</td><td>2 → 3 → 4；历史入库和本次扫描分离，剩余可收递减。</td></tr><tr><td>总仓少货预扣</td><td>总仓打开 D261009006，核对少货与剩余可收。</td><td>可收扣除少货预扣；待确认少货不会被当作实收。</td></tr><tr><td>单外商品 / 超量 / RFID</td><td>使用右侧异常按钮；切换 RFID、开始扫描，重复点击 EPC 测试。</td><td>不匹配和超量不增加；同 EPC 仅首次增加，其他商品可继续。</td></tr><tr><td>多 SKU 中途失败</td><td>收货扫描至少 2 个 SKU；选“第二个 SKU 业务失败”。</td><td>首项保留已入库，失败及未处理项保留；再次提交不重复首项。</td></tr><tr><td>响应丢失</td><td>收货选择“响应丢失 · 结果待核对”，提交并核对。</td><td>暂停扫描和提交；显示核对明细，确认后排除已入库项。</td></tr><tr><td>错仓 / 错状态</td><td>门店收货输入 D261009005，或输入已拒绝单号。</td><td>拦截错误作业，不进入扫描。</td></tr></tbody></table><p style="margin-top:17px">已做浏览器交互验证：创建至总仓收货闭环、少量发货、拒绝必填、部分收货再收齐、错仓拦截、RFID 去重、超量拦截、中途失败后续提及响应丢失核对。JavaScript 语法检查通过。<br><br>演示限制：没有真实扫码硬件、登录、网络或生产库存联调。右侧按钮模拟扫码事件；订单和库存保存在当前浏览器本地，未提交扫描只在当前会话保留。生产权限、并发、超时幂等和设备恢复仍需专项联调。入库单号采用 DEMO-IN 前缀，非生产编号规则。</p></div><div class="flex between"><button class="btn" onclick="switchView('demo')">${icon('arrow')}开始交互演示</button><button class="textbtn" onclick="switchView('sources')">查看代码证据与版本 ↗</button></div>`}

erShipFailWithNoItem();\n 205          }\n 206          Map<Long, ShopTransferOrderItem> itemMap = orderItems.stream().collect(Collectors.toMap(ShopTransferOrderItem::getId, e -> e));\n 207  \n 208          List<String> skuCodes = orderItems.stream().map(ShopTransferOrderItem::getSkuCode).toList();\n 209          Map<String, TenantInventory> shipInventoryMap = tenantInventoryMapper.selectBySkuCodeForUpdate(skuCodes,\n 210                  user.tenantCode(), transferOrder.getSourceWarehouseId()).stream().collect(Collectors.toMap(TenantInventory::getSkuCode, e -> e));\n 211          checkShipInventory(command.getItemList(), itemMap, shipInventoryMap);\n 212  \n 213          Map<String, TenantInventory> receiptInvMap = tenantInventoryMapper.selectBySkuCode(skuCodes, user.tenantCode(),\n 214                  transferOrder.getTargetWarehouseId()).stream().collect(Collectors.toMap(TenantInventory::getSkuCode, e -> e));\n 215          saveShipData(command, user, itemMap, shipInventoryMap, transferOrder, receiptInvMap);\n 216      }\n 217  "}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopTransferOrderServiceImpl.java", "start": 546, "end": 586, "title": "实际数量与状态转换", "note": "库存检查约束锁定与可用量；没有要求 shipQuantity 等于 requireQuantity。提交后整单转 PENDING_INBOUND。", "snippet": " 546      private void checkShipInventory(List<ShopTransferOrderShipItemDto> itemList,\n 547                                      Map<Long, ShopTransferOrderItem> itemMap,\n 548                                      Map<String, TenantInventory> shipInventoryMap) {\n 549          itemList.forEach(item -> {\n 550              if (!itemMap.containsKey(item.getItemId())) {\n 551                  throw TenantInventoryErrors.shopTransferOrderShipFailWithItemNotExist(item.getItemId());\n 552              }\n 553              ShopTransferOrderItem orderItem = itemMap.get(item.getItemId());\n 554              if (!shipInventoryMap.containsKey(orderItem.getSkuCode())) {\n 555                  throw TenantInventoryErrors.inventoryNotExist(orderItem.getSkuCode());\n 556              }\n 557              TenantInventory tenantInventory = shipInventoryMap.get(orderItem.getSkuCode());\n 558              if (tenantInventory.getLocked()) {\n 559                  throw TenantInventoryErrors.inventoryLocked(orderItem.getSkuCode());\n 560              }\n 561              if (tenantInventory.getAvailableQty() < item.getShipQuantity()) {\n 562                  throw TenantInventoryErrors.inventoryOutOfStock(orderItem.getSkuCode());\n 563              }\n 564          });\n 565      }\n 566  \n 567      private void saveShipData(ShopTransferOrderShipCommand command,\n 568                                ShopUserIdentity user,\n 569                                Map<Long, ShopTransferOrderItem> itemMap,\n 570                                Map<String, TenantInventory> shipInventoryMap,\n 571                                ShopTransferOrder transferOrder,\n 572                                Map<String, TenantInventory> receiptInvMap) {\n 573  \n 574          updateShipInventoryAndSaveLog(command.getItemList(), user, itemMap, shipInventoryMap, transferOrder, receiptInvMap);\n 575          transferOrder.setStatus(ShopTransferOrderStatusEnum.PENDING_INBOUND);\n 576          transferOrder.setTotalShipQuantity(command.getItemList().stream().mapToInt(ShopTransferOrderShipItemDto::getShipQuantity).sum());\n 577          transferOrder.setUpdatedBy(user.userId());\n 578          transferOrder.setUpdatedAt(LocalDateTime.now());\n 579          transferOrder.setUpdatedByName(user.getName());\n 580          transferOrder.setShippedAt(LocalDateTime.now());\n 581          transferOrder.setShippedBy(user.userId());\n 582          transferOrder.setShippedByName(user.getName());\n 583          shopTransferOrderMapper.updateById(transferOrder);\n 584          shopTransferOrderMapper.updateOrderItemShipQty(command.getItemList());\n 585          shopTransferOrderLogMapper.insert(buildLog(transferOrder.getId(), ShopTransferOrderLogTypeEnum.SHIPPED.getI18nContentCode(),\n 586                  null, ShopTransferOrderLogTypeEnum.SHIPPED.getEnglishContentFormat(), user));"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopTransferOrderServiceImpl.java", "start": 589, "end": 625, "title": "出库库存记账", "note": "调出可用与总量减少；调入总量与调拨在途增加。", "snippet": " 589      private void updateShipInventoryAndSaveLog(List<ShopTransferOrderShipItemDto> shipItemDtos,\n 590                                                 ShopUserIdentity user,\n 591                                                 Map<Long, ShopTransferOrderItem> itemMap,\n 592                                                 Map<String, TenantInventory> shipInventoryMap,\n 593                                                 ShopTransferOrder transferOrder,\n 594                                                 Map<String, TenantInventory> receiptInvMap) {\n 595          List<TenantInventoryLog> logList = new ArrayList<>(shipItemDtos.size() * 2);\n 596          List<UpdateInventoryDto> updateAvailbleQtyList = new ArrayList<>(shipItemDtos.size());\n 597          List<UpdateInventoryDto> updateAllotInQtyList = new ArrayList<>(shipItemDtos.size());\n 598  \n 599          shipItemDtos.forEach(item -> {\n 600              ShopTransferOrderItem orderItem = itemMap.get(item.getItemId());\n 601              //发货仓可用库存减少\n 602              TenantInventory shippingInv = shipInventoryMap.get(orderItem.getSkuCode());\n 603              updateAvailbleQtyList.add(UpdateInventoryDto.builder()\n 604                      .id(shippingInv.getId())\n 605                      .availableQty(shippingInv.getAvailableQty() - item.getShipQuantity())\n 606                      .inventoryQty(shippingInv.getInventoryQty() - item.getShipQuantity()).build());\n 607              logList.add(createAvailableQtyChangeInvLog(user, shippingInv, orderItem, transferOrder,\n 608                      transferOrder.getOrderCode(), item.getShipQuantity()));\n 609  \n 610              //收货仓 调拨在途增加\n 611              TenantInventory receiptInv = receiptInvMap.containsKey(orderItem.getSkuCode()) ? receiptInvMap.get(orderItem.getSkuCode())\n 612                      : initInventory(orderItem, transferOrder.getTargetWarehouseId(), user);\n 613              updateAllotInQtyList.add(UpdateInventoryDto.builder()\n 614                      .id(receiptInv.getId())\n 615                      .inventoryQty(receiptInv.getInventoryQty() + item.getShipQuantity())\n 616                      .allotInTransitQty(receiptInv.getAllotInTransitQty() + item.getShipQuantity()).build());\n 617              logList.add(buildTransQtyChangeInvLog(user, receiptInv, orderItem, transferOrder,\n 618                      transferOrder.getOrderCode(), item.getShipQuantity()));\n 619          });\n 620          Lists.partition(updateAvailbleQtyList, 50).forEach(items ->\n 621                  tenantInventoryMapper.updateAvailableQty(items, user.userId(), user.displayName(), LocalDateTime.now()));\n 622  \n 623          Lists.partition(updateAllotInQtyList, 50).forEach(items ->\n 624                  tenantInventoryMapper.updateAllotInTransitQty(items, user.userId(), user.displayName(), LocalDateTime.now()));\n 625  "}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopTransferOrderServiceImpl.java", "start": 771, "end": 816, "title": "创建直接出库事务内操作", "note": "创建待入库单、写需求与发货量、调用出库记账、写日志。", "snippet": " 771      private InventoryOrderCreateResponse createShippedOrder(ShopWarehouseAddressVO sourceShopWarehouseDto,\n 772                                                              ShopWarehouseAddressVO targetShopWarehouseDto,\n 773                                                              List<SkuInventoryOrderItemDto> skuItems,\n 774                                                              Map<String, TenantInventory> sourceInventoryMap,\n 775                                                              String remark,\n 776                                                              ShopUserIdentity user) {\n 777  \n 778          ShopTransferOrder order = buildOrder(sourceShopWarehouseDto, targetShopWarehouseDto, user);\n 779          order.setRemark(remark);\n 780          order.setStatus(ShopTransferOrderStatusEnum.PENDING_INBOUND);\n 781          Integer totalQty = skuItems.stream().mapToInt(SkuInventoryOrderItemDto::getQuantity).sum();\n 782          order.setTotalRequireQuantity(totalQty);\n 783          order.setTotalShipQuantity(totalQty);\n 784          order.setShippedAt(order.getCreatedAt());\n 785          order.setShippedBy(user.userId());\n 786          order.setShippedByName(user.displayName());\n 787          shopTransferOrderMapper.insert(order);\n 788  \n 789          List<ShopTransferOrderItem> itemList = skuItems.stream()\n 790                  .map(dto -> {\n 791                      ShopTransferOrderItem item = buildOrderItem(order.getId(), dto);\n 792                      item.setShipQuantity(dto.getQuantity());\n 793                      return item;\n 794                  }).toList();\n 795  \n 796          Lists.partition(itemList, 100).forEach(part -> shopTransferOrderItemMapper.insert(part));\n 797  \n 798          List<String> skuCodes = Lists.newArrayListWithExpectedSize(itemList.size());\n 799          Map<Long, ShopTransferOrderItem> itemMap = HashMap.newHashMap(itemList.size());\n 800          List<ShopTransferOrderShipItemDto> shipItemDtos = Lists.newArrayListWithExpectedSize(itemList.size());\n 801          for (ShopTransferOrderItem item : itemList) {\n 802              skuCodes.add(item.getSkuCode());\n 803              itemMap.put(item.getId(), item);\n 804              shipItemDtos.add(ShopTransferOrderShipItemDto.builder().itemId(item.getId()).shipQuantity(item.getShipQuantity()).build());\n 805          }\n 806  \n 807          Map<String, TenantInventory> receiptInvMap = tenantInventoryMapper.selectBySkuCodeForUpdate(skuCodes, user.tenantCode(),\n 808                  targetShopWarehouseDto.getWarehouseId()).stream().collect(Collectors.toMap(TenantInventory::getSkuCode, e -> e));\n 809  \n 810          updateShipInventoryAndSaveLog(shipItemDtos, user, itemMap, sourceInventoryMap, order, receiptInvMap);\n 811  \n 812          shopTransferOrderLogMapper.insert(buildLog(order.getId(), ShopTransferOrderLogTypeEnum.CREATED.getI18nContentCode(),\n 813                  null, ShopTransferOrderLogTypeEnum.CREATED.getEnglishContentFormat(), user));\n 814  \n 815          return InventoryOrderCreateResponse.builder().orderId(order.getId()).orderCode(order.getOrderCode()).build();\n 816      }"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/enumeration/ShopTransferOrderStatusEnum.java", "start": 19, "end": 35, "title": "状态枚举", "note": "0 待调拨、1 已拒绝、2 待入库、3 部分入库、4 已完成、5 已作废。", "snippet": "  19      PENDING_TRANSFER(0, \"Pending transfer\"),\n  20      REJECTED(1, \"Rejected\"),\n  21      PENDING_INBOUND(2, \"Pending inbound\"),\n  22      PARTIAL_INBOUND(3, \"Partial inbound\"),\n  23      COMPLETED(4, \"Completed\"),\n  24      VOIDED(5, \"Voided\")\n  25      ;\n  26  \n  27      @EnumValue\n  28      private final Integer value;\n  29  \n  30      private final String description;\n  31  \n  32      @Override\n  33      public Integer value() {\n  34          return value;\n  35      }"}, {"repo": "backend-server", "path": "dms-webapi/src/main/java/com/starlink/dms/web/controller/shop/inventory/ShopReceiptController.java", "start": 140, "end": 200, "title": "门店调拨收货入口", "note": "调拨仅有 await/list、create-by-order、create-by-sku；单 SKU 与整单通过分布式锁执行。", "snippet": " 140       * @param query 查询条件\n 141       * @param user  门店后台用户\n 142       * @return 列表\n 143       */\n 144      //@PermissionRequired(oneOf = {\"shop.replenishment.receipt.create\"})\n 145      @ShopPermissionRequired(oneOf = ShopPermission.INVENTORY_RECEIVING_RECEIVING_OPERATE)\n 146      @PostMapping(\"/transfer-order/await/list\")\n 147      public Result<ShopTransferOrderAwaitReceiptVO> listTransferOrderAwaitInfo(@Validated @RequestBody ShopTransferOrderReceiptQuery query,\n 148                                                                                ShopUserIdentity user) {\n 149          return Result.ok(shopReceiptService.listTransferOrderAwaitInfo(query, user));\n 150      }\n 151  \n 152      /**\n 153       * 调拨单收货-整单收货\n 154       *\n 155       * @param command 查询条件\n 156       * @param user    门店后台用户\n 157       * @return 收货单号\n 158       */\n 159      //@PermissionRequired(oneOf = {\"shop.replenishment.receipt.create\"})\n 160      @ShopPermissionRequired(oneOf = ShopPermission.INVENTORY_RECEIVING_RECEIVING_OPERATE)\n 161      @PostMapping(\"/transfer-order/create-by-order\")\n 162      public Result<String> transferCreateByOrder(@Validated @RequestBody ShopTransferReceiptByOrderCommand command,\n 163                                                  ShopUserIdentity user) {\n 164          DistributedLock lock = distributedLockProvider.createFairLock(InventoryConstant.shopReceiptLockKey.formatted(\n 165                  user.tenantCode(), command.getTransferOrderCode()));\n 166          if (!lock.tryLock(Duration.ofMinutes(5))) {\n 167              throw CommonError.concurrentOperationError();\n 168          }\n 169          try {\n 170              return Result.ok(shopReceiptService.transferReceiptByOrder(command, user));\n 171          } finally {\n 172              lock.unlock();\n 173          }\n 174      }\n 175  \n 176  \n 177      /**\n 178       * 调拨单收货-按照SKU收货\n 179       *\n 180       * @param command 查询条件\n 181       * @param user    门店后台用户\n 182       * @return 收货单号\n 183       */\n 184      //@PermissionRequired(oneOf = {\"shop.replenishment.receipt.create\"})\n 185      @ShopPermissionRequired(oneOf = ShopPermission.INVENTORY_RECEIVING_RECEIVING_OPERATE)\n 186      @PostMapping(\"/transfer-order/create-by-sku\")\n 187      public Result<String> transferCreateBySku(@Validated @RequestBody ShopTransferReceiptBySkuCommand command,\n 188                                                ShopUserIdentity user) {\n 189          DistributedLock lock = distributedLockProvider.createFairLock(InventoryConstant.shopReceiptLockKey.formatted(\n 190                  user.tenantCode(), command.getTransferOrderCode()));\n 191          if (!lock.tryLock(Duration.ofMinutes(5))) {\n 192              throw CommonError.concurrentOperationError();\n 193          }\n 194          try {\n 195              return Result.ok(shopReceiptService.transferReceiptBySku(command, user));\n 196          } finally {\n 197              lock.unlock();\n 198          }\n 199      }\n 200  "}, {"repo": "backend-server", "path": "dms-webapi/src/main/java/com/starlink/dms/web/controller/tenant/TenantReceiptOrderController.java", "start": 192, "end": 248, "title": "总仓调拨收货入口", "note": "总仓 tenant 入口复用同一 ShopReceiptService。", "snippet": " 192       * 门店调拨单收货-查询待收货信息\n 193       *\n 194       * @param query 查询条件\n 195       * @param user  门店后台用户\n 196       * @return 列表\n 197       */\n 198      @TenantPermissionRequired(oneOf = {TenantPermission.WMS_RECEIVING_OPS_VIEW})\n 199      @PostMapping(\"/transfer-order/await/list\")\n 200      public Result<ShopTransferOrderAwaitReceiptVO> listTransferOrderAwaitInfo(@Validated @RequestBody ShopTransferOrderReceiptQuery query,\n 201                                                                                TenantUserIdentity user) {\n 202          return Result.ok(shopReceiptService.listTransferOrderAwaitInForTenant(query, user));\n 203      }\n 204  \n 205      /**\n 206       * 门店调拨单收货-整单收货\n 207       *\n 208       * @param command 查询条件\n 209       * @param user    门店后台用户\n 210       * @return 收货单号\n 211       */\n 212      @TenantPermissionRequired(oneOf = {TenantPermission.WMS_RECEIVING_OPS_VIEW})\n 213      @PostMapping(\"/transfer-order/create-by-order\")\n 214      public Result<String> transferCreateByOrder(@Validated @RequestBody ShopTransferReceiptByOrderCommand command,\n 215                                                  TenantUserIdentity user) {\n 216          DistributedLock lock = distributedLockProvider.createFairLock(InventoryConstant.shopReceiptLockKey.formatted(\n 217                  user.tenantCode(), command.getTransferOrderCode()));\n 218          if (!lock.tryLock(Duration.ofMinutes(5))) {\n 219              throw CommonError.concurrentOperationError();\n 220          }\n 221          try {\n 222              return Result.ok(shopReceiptService.transferReceiptByOrderForTenant(command, user));\n 223          } finally {\n 224              lock.unlock();\n 225          }\n 226      }\n 227  \n 228  \n 229      /**\n 230       * 门店调拨单收货-按照SKU收货\n 231       *\n 232       * @param command 查询条件\n 233       * @param user    门店后台用户\n 234       * @return 收货单号\n 235       */\n 236      @TenantPermissionRequired(oneOf = {TenantPermission.WMS_RECEIVING_OPS_VIEW})\n 237      @PostMapping(\"/transfer-order/create-by-sku\")\n 238      public Result<String> transferCreateBySku(@Validated @RequestBody ShopTransferReceiptBySkuCommand command,\n 239                                                TenantUserIdentity user) {\n 240          DistributedLock lock = distributedLockProvider.createFairLock(InventoryConstant.shopReceiptLockKey.formatted(\n 241                  user.tenantCode(), command.getTransferOrderCode()));\n 242          if (!lock.tryLock(Duration.ofMinutes(5))) {\n 243              throw CommonError.concurrentOperationError();\n 244          }\n 245          try {\n 246              return Result.ok(shopReceiptService.transferReceiptBySkuForTenant(command, user));\n 247          } finally {\n 248              lock.unlock();"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopReceiptServiceImpl.java", "start": 641, "end": 656, "title": "收货目标与状态校验", "note": "shop 调用限定调入门店；tenant 拒绝调入门店的单据。当前方法未显式设置 2/3 状态白名单。", "snippet": " 641      private ShopTransferOrder getAndCheckTransferOrder(String orderCode,\n 642                                                         String tenantCode,\n 643                                                         Long shopId) {\n 644          ShopTransferOrder order = transferOrderMapper.findByCodeAndTargetShopId(orderCode, tenantCode, shopId);\n 645          if (order == null || (shopId == null && order.getTargetShopId() != null)) {\n 646              throw TenantInventoryErrors.shopTransferOrderNotExists();\n 647          }\n 648          if (ShopTransferOrderStatusEnum.COMPLETED.equals(order.getStatus())) {\n 649              throw TenantInventoryErrors.shopTransferOrderCompleted(orderCode);\n 650          }\n 651          int shortQty = getNotCancelledShorageQty(ShopDiscrepancySourceOrderTypeEnum.TRANSFER_ORDER, order.getId());\n 652          if (shortQty + order.getTotalReceiptQuantity() == order.getTotalShipQuantity()) {\n 653              throw TenantInventoryErrors.noReceivableQuantity();\n 654          }\n 655          return order;\n 656      }"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopReceiptServiceImpl.java", "start": 874, "end": 911, "title": "单 SKU 收货与入库单归并", "note": "超过 canReceiptQty 拒绝；orderCode 用来归并同一入库单。", "snippet": " 874      private String doTransferReceiptBySku(ShopTransferReceiptBySkuCommand command,\n 875                                            String tenantCode,\n 876                                            Long shopId,\n 877                                            Long userId,\n 878                                            String userName) {\n 879          ShopTransferOrder transferOrder = getAndCheckTransferOrder(command.getTransferOrderCode(), tenantCode, shopId);\n 880          List<ShopTransferOrderItem> firstItems = checkAndGetAwaitTransferItems(transferOrder, command.getSkuCode());\n 881          Map<Long, ReceiptDiscrepancySumDto> discrepancySumDtoMap = buildShortageMap(ShopDiscrepancySourceOrderTypeEnum.TRANSFER_ORDER,\n 882                  firstItems.stream().map(ShopTransferOrderItem::getId).toList());\n 883          ShopTransferOrderItem transferItem = removeTransferShortageQty(discrepancySumDtoMap, firstItems).getFirst();\n 884          Integer canReceiptQty = getCanReceiptQty(discrepancySumDtoMap, transferItem);\n 885          if (command.getQuantity() > canReceiptQty) {\n 886              throw TenantInventoryErrors.receiptOverQuantity(command.getSkuCode(), canReceiptQty);\n 887          }\n 888          // 查询入库库存信息\n 889          String skuCode = transferItem.getSkuCode();\n 890          TenantInventory inventory = checkAndGetInventory(Lists.newArrayList(skuCode),\n 891                  transferOrder.getTargetWarehouseId(), tenantCode).get(skuCode);\n 892          //保存、更新入库单信息\n 893          TenantReceiptOrder order = null;\n 894          boolean orderExists = false;\n 895          TenantReceiptOrderItem receiptOrderItem = null;\n 896          boolean existsOrderItem = false;\n 897          //验证传入的单号相关\n 898          if (StringUtils.hasText(command.getOrderCode())) {\n 899              order = checkAndGetReceiptOrder(tenantCode, command.getOrderCode());\n 900              orderExists = command.getTransferOrderCode().equals(order.getSourceNumber());\n 901              if (orderExists) {\n 902                  receiptOrderItem = receiptOrderItemMapper.getBy(order.getId(), skuCode);\n 903                  existsOrderItem = receiptOrderItem != null;\n 904              }\n 905          }\n 906          if (!orderExists) {\n 907              order = createTransferReceiptOrder(transferOrder, userId, userName);\n 908              order.setSkuCount(1);\n 909              order.setTotalQuantity(command.getQuantity());\n 910              receiptOrderMapper.insert(order);\n 911          } else {"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/service/impl/ShopReceiptServiceImpl.java", "start": 974, "end": 983, "title": "完成条件", "note": "实际收货 + 已确认少货与发货量相等才 COMPLETED；否则 PARTIAL_INBOUND。", "snippet": " 974      private void updateTransferOrderStatus(int receiptQtyThisTime, Long userId, String userName, ShopTransferOrder transferOrder, String receiptOrderCode) {\n 975          Integer orderDiscrepancyQty = transferOrder.getHasAbnormal() ?\n 976                  receiptDiscrepancyMapper.sumConfirmedShortageQtyByOrder(ShopDiscrepancySourceOrderTypeEnum.TRANSFER_ORDER, transferOrder.getId()) : 0;\n 977          ShopTransferOrderStatusEnum newStatus = transferOrder.getTotalReceiptQuantity() + receiptQtyThisTime + orderDiscrepancyQty == transferOrder.getTotalShipQuantity() ?\n 978                  ShopTransferOrderStatusEnum.COMPLETED : ShopTransferOrderStatusEnum.PARTIAL_INBOUND;\n 979          transferOrderMapper.updateOrderReceiptInfo(transferOrder.getId(), transferOrder.getTotalReceiptQuantity() + receiptQtyThisTime,\n 980                  newStatus, userId, userName, LocalDateTime.now());\n 981          ShopTransferOrderLogTypeEnum logType = newStatus.equals(ShopTransferOrderStatusEnum.COMPLETED) ?\n 982                  ShopTransferOrderLogTypeEnum.RECEIPT : ShopTransferOrderLogTypeEnum.PARTIAL_RECEIPT;\n 983          transferOrderLogMapper.insert(buildTransferReceiptLog(transferOrder.getId(), logType, receiptOrderCode, userId, userName));"}, {"repo": "backend-server", "path": "dms-core/src/main/java/com/starlink/dms/core/tenant/inventory/pojo/dto/AwaitReceiptOrderItemDto.java", "start": 91, "end": 102, "title": "剩余可收数量", "note": "canReceiptQuantity = max(0, shipmentQuantity - receiptQuantity - shortageQty)。", "snippet": "  91       */\n  92      private int shortageQty;\n  93  \n  94      /**\n  95       * 多货数量(待确认+已确认)\n  96 )) {\n 257                  is DataState.Success -> {\n 258                      _uiState.update { it.copy(isProcessing = false) }\n 259                      _events.send(ReplenishmentReceivingEvent.SubmitSuccess)\n 260                  }\n 261  \n 262                  is DataState.BusinessError -> {\n 263                      if (!state.code.postAuthSessionExpiredEventIfNeeded()) {\n 264                          showSubmitError(state.message)\n 265                      }\n 266                  }\n 267                  is DataState.NetworkError -> showSubmitError(state.message)\n 268                  is DataState.Loading -> Unit\n 269              }\n 270          }"}, {"repo": "frontend-pos-pda", "path": "feature/main/impl/src/main/java/com/app/feature/main/page/role_store/receive/replenishment_receive/ReplenishmentReceivingViewModel.kt", "start": 346, "end": 398, "title": "PDA 扫描匹配与计数", "note": "EPC 解码为 GTIN、匹配 SKU、校验 remainingScanQuantity 后增加 pendingReceiveMap。", "snippet": " 346      /** RFID 仅在 EPC 解码、商品匹配和数量累计均成功后播放成功反馈。 */\n 347      private fun handleRfidRead(event: EpcEvent) {\n 348          val epc = event.epc.trim().uppercase()\n 349          if (epc.isBlank() || rfidEpcSessionTracker.shouldSkip(epc)) return\n 350  \n 351          // 保留原页面 runCatching 的异常处理范围。\n 352          val upc = runCatching { epcDecoder.decode(epc) }.getOrNull()?.gtin\n 353          if (upc == null) {\n 354              rfidEpcSessionTracker.markRejected(epc)\n 355              return\n 356          }\n 357  \n 358          val matchedItemKey = tryAccumulateScan(upc, warnOnMiss = false)\n 359          if (matchedItemKey == null) {\n 360              rfidEpcSessionTracker.markRejected(epc)\n 361              return\n 362          }\n 363  \n 364          rfidEpcSessionTracker.markAccepted(epc = epc, itemKey = matchedItemKey)\n 365          scanFeedback.epcBeep()\n 366      }\n 367  \n 368      private fun tryAccumulateScan(code: String, warnOnMiss: Boolean): String? {\n 369          val itemKey = resolveScanCode(code)\n 370          val line = itemKey?.let { key -> _uiState.value.lines.firstOrNull { it.id == key } }\n 371          if (itemKey == null || line == null) {\n 372              if (warnOnMiss) {\n 373                  scanFeedback.warning()\n 374                  viewModelScope.launch { _events.send(ReplenishmentReceivingEvent.UnknownItem) }\n 375              }\n 376              return null\n 377          }\n 378  \n 379          if (line.remainingScanQuantity <= 0) {\n 380              if (warnOnMiss) {\n 381                  scanFeedback.warning()\n 382                  viewModelScope.launch { _events.send(ReplenishmentReceivingEvent.ItemAlreadyReceived) }\n 383              }\n 384              return null\n 385          }\n 386  \n 387          pendingReceiveMap[itemKey] = (pendingReceiveMap[itemKey] ?: 0) + 1\n 388          _uiState.update { it.copy(pendingReceiveItems = pendingReceiveMap.toMap()) }\n 389          return itemKey\n 390      }\n 391  \n 392      private fun resolveScanCode(code: String): String? {\n 393          val trimmed = code.trim()\n 394          if (trimmed.isBlank()) return null\n 395          scanCodeIndex[trimmed]?.let { return it }\n 396          return scanCodeIndex[trimmed.normalizedDigits()]\n 397      }\n 398  "}, {"repo": "frontend-pos-pda", "path": "feature/main/impl/src/main/java/com/app/feature/main/page/role_store/receive/replenishment_receive/RfidEpcSessionTracker.kt", "start": 5, "end": 35, "title": "RFID 会话去重", "note": "成功 EPC 去重；失败 EPC 短期限流。", "snippet": "   5  /**\n   6   * 跟踪单次收货会话中的 RFID EPC。\n   7   *\n   8   * 成功 EPC 在清除对应 SKU 前持续去重；失败 EPC 只做短期限流，避免未知或超量标签永久失效。\n   9   */\n  10  internal class RfidEpcSessionTracker(\n  11      private val rejectThrottleMs: Long = DEFAULT_REJECT_THROTTLE_MS,\n  12      private val elapsedRealtimeMillis: () -> Long = { SystemClock.elapsedRealtime() },\n  13  ) {\n  14      private val acceptedEpcs = mutableSetOf<String>()\n  15      private val acceptedEpcsByItemKey = mutableMapOf<String, MutableSet<String>>()\n  16      private val recentlyRejectedAt = mutableMapOf<String, Long>()\n  17      private var lastRejectedCleanupAt = 0L\n  18  \n  19      /** 判断 EPC 是否已成功接收，或仍处于失败限流时间内。 */\n  20      fun shouldSkip(epc: String): Boolean {\n  21          if (epc in acceptedEpcs) return true\n  22  \n  23          val rejectedAt = recentlyRejectedAt[epc] ?: return false\n  24          val now = elapsedRealtimeMillis()\n  25          if (now - rejectedAt < rejectThrottleMs) return true\n  26  \n  27          recentlyRejectedAt.remove(epc)\n  28          return false\n  29      }\n  30  \n  31      /** 记录已成功计入数量的 EPC，并关联到对应 SKU。 */\n  32      fun markAccepted(epc: String, itemKey: String) {\n  33          acceptedEpcs.add(epc)\n  34          acceptedEpcsByItemKey.getOrPut(itemKey) { mutableSetOf() }.add(epc)\n  35          recentlyRejectedAt.remove(epc)"}, {"repo": "frontend-pos-pda", "path": "feature/main/impl/src/main/java/com/app/feature/main/rfid/BarcodeInputNormalizer.kt", "start": 1, "end": 17, "title": "硬件条码标准化", "note": "硬件输入逐行剥离 G6380-，保留其余编码。", "snippet": "   1  package com.app.feature.main.rfid\n   2  \n   3  private const val SCANNED_BARCODE_PREFIX = \"G6380-\"\n   4  \n   5  /** 仅用于硬件条码输入：逐条忽略大小写去掉开头的固定前缀，保留编码其余内容。 */\n   6  internal fun normalizeScannedBarcode(input: String): String =\n   7      input.lineSequence()\n   8          .map { line ->\n   9              val code = line.trim()\n  10              if (code.startsWith(SCANNED_BARCODE_PREFIX, ignoreCase = true)) {\n  11                  code.drop(SCANNED_BARCODE_PREFIX.length)\n  12              } else {\n  13                  code\n  14              }\n  15          }\n  16          .filter { it.isNotBlank() }\n  17          .joinToString(\"\\n\")"}, {"repo": "frontend-pos-pda", "path": "core/designsystem/src/main/java/com/app/core/designsystem/theme/Color.kt", "start": 5, "end": 20, "title": "PDA 视觉主题", "note": "暖白背景、黑色主色、浅灰容器。", "snippet": "   5  // = function renderSources(){return `<div class="reporthero"><div><div class="eyebrow">Evidence / repository snapshot</div><h1>从代码到交互，每一处有据可查。</h1><p>分析前已对三个仓库执行 git pull --ff-only origin master；均快进更新成功。下列代码片段来自更新后的工作目录。业务仓库未做额外修改。</p></div></div><div class="reportgrid">${versions.map(v=>`<div class="reportcard"><div class="eyebrow">MASTER / CLEAN</div><h3>${v.repo}</h3><code>${v.commit}</code><p style="margin-top:12px">同步方式：fast-forward<br>同步日期：2026-10-10<br>工作区：${v.status?'有改动':'干净'}</p></div>`).join('')}</div><div class="notice">这些片段是业务分析依据，不是待执行的指令。演示中新增的交互和待补接口已在「系统方案」单独标注。附件截图仅作为现有 PDA 视觉参考。</div><div class="searchbox">${icon('search')}<input placeholder="筛选代码依据：如 RFID、收货、创建、仓库" oninput="filterEvidence(this.value)"></div><div id="evidenceList">${evidenceHTML(evidence)}</div>`}
function evidenceHTML(items){return items.map((e,i)=>`<article class="sourceitem"><h3><span class="tag">${e.repo}</span>${e.title}</h3><p>${e.note}</p><code>${esc(e.path)}:${e.start}–${e.end}</code><details><summary>展开源码片段</summary><pre>${esc(e.snippet)}</pre></details></article>`).join('')}
function filterEvidence(q){$('evidenceList').innerHTML=evidenceHTML(evidence.filter(e=>(e.title+e.note+e.path).toLowerCase().includes(q.toLowerCase())))}
$('report').innerHTML=makeReport();$('sourcesReport').innerHTML=renderSources();render();
// Prevent navigation and role changes while a write sequence is processing.
document.addEventListener('click',e=>{if(state.screen==='processing'){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('change',e=>{if(state.screen==='processing'){e.preventDefault();e.stopImmediatePropagation();$('roleSelect').value=state.role}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.screen!=='processing')closeSheet();if(e.key==='Tab'&&$('overlay').querySelector('.sheet')){const el=$('overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled)');if(!el.length)return;const first=el[0],last=el[el.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.addEventListener('beforeunload',e=>{if(totalCounts()>0||state.screen==='processing'){e.preventDefault();e.returnValue=''}});
