    function billDetailPage(i){const r=state.bills[i]||state.bills[0],batch=state.batches.find(x=>x.code===r.source),fees=batch?[['货款','¥ '+fmt(batch.cargo),'实际提货 PCS'],['打包费','¥ '+fmt(batch.packing),'实际提货 PCS'],['中港车费','¥ '+fmt(batch.truck),'实际提货 PCS'],['FOB 操作费','$ '+fmt(batch.fob),'冻结操作费快照']]:[['账单金额','$ '+r.amount,'账单原始金额']],skuRows=batch?state.products.slice(0,Math.min(4,state.products.length)).map((p,pi)=>{const qty=Math.max(8,Math.floor(batch.pcs/(pi+3))),price=[42.80,39.50,46.20,44.90][pi],shipCode=batch.ships[pi%batch.ships.length],meta=shipMeta(shipCode),orderNo=batch.orders[pi%batch.orders.length];return `<tr><td>${orderNo}</td><td>${meta.hq}</td><td>${shipCode}</td><td>${batch.code}</td><td>${p.sku}</td><td>${p.name}</td><td>${p.attr}</td><td>${qty}</td><td>$ ${fmt(price)}</td><td>$ ${fmt(qty*price)}</td></tr>`}).join(''):`<tr><td colspan="10">该账单暂无 SKU 明细</td></tr>`;return `<div class="page detail-page"><div class="crumb"><span>财务管理</span><span>/</span><b>账单详情</b></div><div class="form-top"><button class="btn" id="backBillDetail">返回</button>${r.action?`<button class="btn primary" data-confirm-bill="${i}">${r.action}</button>`:''}</div><section class="form-section"><div class="section-title">账单详情</div><div class="detail-grid" style="margin:18px 20px"><div><label>账单单号</label><span>${r.code}</span></div><div><label>账单类型</label><span>${r.type}</span></div><div><label>账单金额</label><span>$ ${r.amount}</span></div><div><label>状态</label><span class="status ${statusClass(r.status)}">${r.status}</span></div><div><label>关联业务单号</label><span>${r.source}</span></div><div><label>付款截止时间</label><span>${r.due}</span></div><div><label>结算方式</label><span>${r.type==='FOB'?'确认后直接结算，不生成付款单':'按现有账单流程'}</span></div></div></section><section class="form-section"><div class="section-title">SKU 明细</div><div class="table-shell"><table class="data-table" style="min-width:1450px"><thead><tr><th>采购订单号</th><th>总部发货单号</th><th>门店发货单号</th><th>提货批次号</th><th>SKU</th><th>产品名称</th><th>属性</th><th>提货数量</th><th>采购单价(USD)</th><th>货款金额(USD)</th></tr></thead><tbody>${skuRows}</tbody></table></div></section><section class="form-section"><div class="section-title">费用明细</div><div class="table-shell"><table class="data-table"><thead><tr><th>费用项目</th><th>金额</th><th>计费依据</th></tr></thead><tbody>${fees.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div></section></div>`}
    function billDetailPage(i){const r=state.bills[i]||state.bills[0],batch=state.batches.find(x=>x.code===r.source),fees=batch?[['货款','¥ '+fmt(batch.cargo),'实际提货 PCS'],['打包费','¥ '+fmt(batch.packing),'实际提货 PCS'],['中港车费','¥ '+fmt(batch.truck),'实际提货 PCS'],['FOB 操作费','$ '+fmt(batch.fob),'冻结操作费快照']]:[['账单金额','$ '+r.amount,'账单原始金额']],skuRows=batch?state.products.slice(0,Math.min(4,state.products.length)).map((p,pi)=>{const qty=Math.max(8,Math.floor(batch.pcs/(pi+3))),price=[42.80,39.50,46.20,44.90][pi],shipCode=batch.ships[pi%batch.ships.length],meta=shipMeta(shipCode),orderNo=batch.orders[pi%batch.orders.length];return `<tr><td>${orderNo}</td><td>${meta.hq}</td><td>${shipCode}</td><td>${batch.code}</td><td>${p.sku}</td><td>${p.name}</td><td>${p.attr}</td><td>${qty}</td><td>$ ${fmt(price)}</td><td>$ ${fmt(qty*price)}</td></tr>`}).join(''):`<tr><td colspan="10">该账单暂无 SKU 明细</td></tr>`,feeSection=state.role==='dms'?'':`<section class="form-section"><div class="section-title">费用明细</div><div class="table-shell"><table class="data-table"><thead><tr><th>费用项目</th><th>金额</th><th>计费依据</th></tr></thead><tbody>${fees.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div></section>`;return `<div class="page detail-page"><div class="crumb"><span>财务管理</span><span>/</span><b>账单详情</b></div><div class="form-top"><button class="btn" id="backBillDetail">返回</button>${r.action?`<button class="btn primary" data-confirm-bill="${i}">${r.action}</button>`:''}</div><section class="form-section"><div class="section-title">账单详情</div><div class="detail-grid" style="margin:18px 20px"><div><label>账单单号</label><span>${r.code}</span></div><div><label>账单类型</label><span>${r.type}</span></div><div><label>账单金额</label><span>$ ${r.amount}</span></div><div><label>状态</label><span class="status ${statusClass(r.status)}">${r.status}</span></div><div><label>关联业务单号</label><span>${r.source}</span></div><div><label>付款截止时间</label><span>${r.due}</span></div><div><label>结算方式</label><span>${r.type==='FOB'?'确认后直接结算，不生成付款单':'按现有账单流程'}</span></div></div></section><section class="form-section"><div class="section-title">SKU 明细</div><div class="table-shell"><table class="data-table" style="min-width:1450px"><thead><tr><th>采购订单号</th><th>总部发货单号</th><th>门店发货单号</th><th>提货批次号</th><th>SKU</th><th>产品名称</th><th>属性</th><th>提货数量</th><th>采购单价(USD)</th><th>货款金额(USD)</th></tr></thead><tbody>${skuRows}</tbody></table></div></section>${feeSection}</div>`}
    function render(){const c=$('#content'),page=state.page;c.innerHTML=page==='stock-list'?stockList():page==='stock-create'?createStock():page==='stock-inventory'?stockInventory():page==='stock-detail'?stockDetailPage(state.stockDetailIndex||0):page==='pickup-list'?pickupList(false):page==='customs-list'?pickupList(true):page==='bill-list'?billList():page==='bill-detail'?billDetailPage(state.billDetailIndex||0):page==='adjust-list'?adjustList():page==='dealer-list'?dealerList():page==='erp-store-list'?erpStoreList():page==='erp-store-detail'?erpStoreDetail(state.erpDetailIndex||0):page==='erp-pickup'?erpPickup():page==='erp-pickup-print'?erpPickupPrint():placeholder($('#currentTab').textContent);bindPage()}
    document.addEventListener('click',e=>{const stock=e.target.closest?.('[data-stock-detail]'),bill=e.target.closest?.('[data-bill-detail]');if(stock){e.preventDefault();e.stopImmediatePropagation();state.stockDetailIndex=Number(stock.dataset.stockDetail);state.page='stock-detail';setTab('备货发货单详情');renderMenu();render();return}if(bill){e.preventDefault();e.stopImmediatePropagation();state.billDetailIndex=Number(bill.dataset.billDetail);state.page='bill-detail';setTab('账单详情');renderMenu();render();return}if(e.target.id==='backStockDetail'){e.preventDefault();e.stopImmediatePropagation();state.page='stock-list';setTab('备货发货单');renderMenu();render();return}if(e.target.id==='backBillDetail'){e.preventDefault();e.stopImmediatePropagation();state.page='bill-list';setTab('应付账单');renderMenu();render();return}if(e.target.id==='printPickup'){e.preventDefault();e.stopImmediatePropagation();state.page='erp-pickup-print';setTab('提货单打印');renderMenu();render();return}if(e.target.id==='backPickupPrint'){e.preventDefault();e.stopImmediatePropagation();state.page='erp-pickup';setTab('线下提货');renderMenu();render();return}if(e.target.id==='doNativePrint'){window.print();return}},true);
    $$('.role-switch button').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;if(state.role==='dms'){state.page='stock-list';setTab('备货发货单')}else if(state.role==='brand'){state.page='customs-list';setTab('提货报关管理')}else{state.page='erp-store-list';setTab('门店发货单')}shell();render()});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer'))closeDrawer()});shell();render();
  </script>
