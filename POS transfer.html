<script>

'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const warehouses={A:'A店 · 中环店',B:'B店 · 金钟店',C:'香港总仓 A',D:'香港总仓 B'};
const products=[{sku:'DEMO-FLAT-36',name:'针织平底鞋',attr:'黑色 / EU 36',upc:'DEMO100036'},{sku:'DEMO-FLAT-37',name:'针织平底鞋',attr:'米色 / EU 37',upc:'DEMO100037'},{sku:'DEMO-HEEL-38',name:'方头低跟鞋',attr:'奶咖 / EU 38',upc:'DEMO200038'}];
const labels={pending:'待调拨',inbound:'待入库',partial:'部分入库',done:'已完成',rejected:'已拒绝',void:'已作废'};
let mode='pos',kind='store',role='A',page='list',selected=null,statusFilter='all',query='',draft=null,scenario='normal',modalAction=null;
let state,notes=[],editingNote=null,notesOpen=false,noteSaveError='';
const noteKey='stock-transfer.notes.v1';
try{notes=JSON.parse(localStorage.getItem(noteKey)||'[]');if(!Array.isArray(notes))notes=[]}catch(e){noteSaveError='无法读取本地备注，请导入已导出的 JSON。'}
function qty(o,f){return o.items.reduce((s,i)=>s+(i[f]||0),0)}
function fresh(){state={carts:{A:[],B:[]},next:7,stocks:{A:[1,0,2],B:[8,5,3],C:[80,50,30],D:[20,15,10]},transit:{A:[0,0,0],B:[0,0,0],C:[0,0,0],D:[0,0,0]},orders:[]};
const seed=(id,k,source,target,status,origin,items)=>{const o={id,code:(k==='store'?'ST':'CW')+'26102600'+id,kind:k,source,target,status,origin,remark:'',created:'2026-10-26 09:'+String(id*7).padStart(2,'0'),items:items.map(([p,n])=>({p,request:n,shipped:0,received:0,sold:0})),logs:[{text:origin+'创建调拨单',time:'2026-10-26 09:'+String(id*7).padStart(2,'0')} ]};state.orders.push(o);if(['inbound','partial','done'].includes(status)){o.items.forEach(i=>{i.shipped=i.request;state.stocks[source][i.p]-=i.shipped;state.transit[target][i.p]+=i.shipped});o.logs.push({text:'调出方确认出库',time:'2026-10-26 10:00'});}if(status==='done'){o.items.forEach(i=>{i.received=i.shipped;state.stocks[target][i.p]+=i.received;state.transit[target][i.p]-=i.received});o.logs.push({text:'调入方完成入库',time:'2026-10-26 10:20'})}if(status==='partial'){o.items[0].received=1;state.stocks[target][o.items[0].p]++;state.transit[target][o.items[0].p]--;o.logs.push({text:'调入方部分收货 1 件',time:'2026-10-26 10:20'})}return o;};
seed(1,'store','B','A','pending','DMS',[[0,2],[1,1]]);seed(2,'store','B','A','inbound','POS · A店',[[2,1]]);seed(3,'store','A','B','done','DMS',[[0,1]]);seed(4,'central','C','D','inbound','DMS · 总仓A',[[0,5],[1,3]]);seed(5,'store','B','A','partial','POS · A店',[[1,2]]);seed(6,'store','A','B','rejected','DMS',[[2,1]]);state.orders[5].reason='门店留样，暂不可调出';}
function time(){return new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).slice(0,16)}
function log(o,text){o.logs.push({text,time:time()})}
function badge(status){return '<span class="badge '+({inbound:'blue',partial:'blue',done:'green',rejected:'red',void:'gray'}[status]||'')+'">'+labels[status]+'</span>'}
function toast(text,error=false){let t=$('toast');t.hidden=false;t.className='toast';t.style.color=error?'#bb5353':'';t.style.background=error?'#fff0f0':'';t.textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4000)}
function options(list,value){return list.map(([v,n])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(n)+'</option>').join('')}
function accessible(o){return mode==='dms'&&role==='总部'||o.source===role||o.target===role}
function roles(){return mode==='pos'?[['A','A店 · 中环店'],['B','B店 · 金钟店']]:[['总部','总部运营'],['A','A店 · 调入/调出'],['B','B店 · 调入/调出'],['C','总仓 A · 仓管员'],['D','总仓 B · 仓管员']]}
function doSearch(){query=$('search').value.trim();render()}
function startCreate(){kind=mode==='dms'&&['C','D'].includes(role)?'central':'store';page='create';receiveValues={};shipValues={};draft={source:kind==='central'?role:mode==='pos'&&role==='B'?'A':'B',target:kind==='central'?(role==='C'?'D':'C'):mode==='pos'?role:'A',remark:'',items:[]};scenario='normal';render()}
function draftField(k,v){draft[k]=v;if(k==='source'){draft.items=[]}render()}
function addSku(){const v=$('skuSelect').value;if(!v)return toast('请选择商品',true);addByIndex(Number(v))}
function addByIndex(p){const old=draft.items.find(i=>i.p===p);if(old)old.request++;else draft.items.push({p,request:1,shipped:0,received:0,sold:0});render()}
function scanSku(){let v=$('scan').value.trim();let p=products.findIndex(p=>p.sku===v||p.upc===v);if(p<0)return toast('未找到商品，请核对 SKU / UPC',true);addByIndex(p)}
function current(){return state.orders.find(o=>o.id===selected)}
function closeModal(){$('overlay').innerHTML='';modalAction=null}
function modalError(msg){$('modalError').textContent=msg}
function ship(o,amounts=o.items.map(i=>i.request)){o.items.forEach((i,n)=>{state.stocks[o.source][i.p]-=amounts[n];state.transit[o.target][i.p]+=amounts[n];i.shipped=amounts[n]});o.status='inbound';log(o,warehouses[o.source]+(o.kind==='central'?'创建并自动出库 ':'审核同意并出库 ')+qty(o,'shipped')+' 件')}
function askVoid(){const o=current();showModal('作废未出库申请','<p>仅限待调拨单据；作废后不可出库。</p>',()=>{if(role!=='总部'||o.status!=='pending')return modalError('当前状态不允许作废');o.status='void';log(o,'DMS 总部作废申请');closeModal();render();toast('申请已作废');});}
function persistNotes(){try{localStorage.setItem(noteKey,JSON.stringify(notes));noteSaveError='';return true}catch(e){noteSaveError='本地保存失败，请立即导出 JSON 备份。';return false}}
function openNotes(){notesOpen=true;drawNotes()}
function drawNotes(){if(!notesOpen){$('notes').innerHTML='';return}let edit=notes.find(n=>n.id===editingNote);$('notes').innerHTML='<aside class="drawer"><div class="heading"><h2>我的备注</h2><button onclick="notesOpen=false;drawNotes()">收起</button></div><p class="muted" style="font-size:12px">补充业务逻辑、字段说明或例外规则。备注仅保存于当前浏览器与文件环境；分享 Demo 时请同时导出 JSON。</p><label for="noteRef">关联页面 / 流程 / 字段</label><input id="noteRef" placeholder="例如：POS / 审核并出库 / 数量" value="'+esc(edit?.ref||'')+'"><label for="noteType">备注类型</label><select id="noteType">'+options(['业务逻辑','字段说明','例外规则','其他'].map(v=>[v,v]),edit?.type||'业务逻辑')+'</select><label for="noteText">备注正文</label><textarea id="noteText" rows="4" placeholder="请输入你的补充说明">'+esc(edit?.text||'')+'</textarea><div class="row"><button class="primary" onclick="saveNote()">'+(edit?'保存修改':'新增备注')+'</button>'+(edit?'<button onclick="editingNote=null;drawNotes()">取消编辑</button>':'')+'</div><div id="noteMessage" class="error">'+esc(noteSaveError)+'</div><div class="context">'+(noteSaveError?'':notes.length?'已尝试自动保存；可导出备份。':'备注默认留空，尚无个人意见。')+'</div>'+notes.map(n=>'<article class="note-item"><span class="tag">'+esc(n.type)+'</span>　'+esc(n.ref)+'<p>'+esc(n.text)+'</p><div class="inline-actions"><button class="link" onclick="editingNote=\''+n.id+'\';drawNotes()">编辑</button><button class="link" onclick="deleteNote(\''+n.id+'\')">删除</button></div></article>').join('')+'<hr style="border:0;border-top:1px solid #e7e9ee;margin:24px 0"><div class="row"><button onclick="exportNotes()">导出 JSON</button><button onclick="$(\'noteFile\').click()">导入 JSON</button><button class="danger" onclick="clearNotes()">清空</button></div><input id="noteFile" type="file" accept="application/json,.json" hidden onchange="importNotes(this.files[0])"><p class="muted" style="font-size:11px">备注为个人补充意见，不自动代表正式需求变更。导入采用追加方式，保留已有备注。</p></aside>';}
function saveNote(){let ref=$('noteRef').value.trim(),text=$('noteText').value.trim();if(!ref||!text){$('noteMessage').textContent='请填写关联位置和正文';return}let n={id:editingNote||crypto.randomUUID(),ref,type:$('noteType').value,text};let i=notes.findIndex(n=>n.id===editingNote);if(i>=0)notes[i]=n;else notes.push(n);editingNote=null;const ok=persistNotes();render();drawNotes();toast(ok?'备注已保存到本地浏览器':'备注仅在内存中，请导出 JSON',!ok)}
function deleteNote(id){notes=notes.filter(n=>n.id!==id);if(editingNote===id)editingNote=null;persistNotes();render();drawNotes()}
function exportNotes(){let blob=new Blob([JSON.stringify({requirement:'stock-transfer',version:1,notes},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock-transfer-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importNotes(file){if(!file)return;try{let data=JSON.parse(await file.text());if(data.requirement!=='stock-transfer'||data.version!==1||!Array.isArray(data.notes)||data.notes.some(n=>typeof n.ref!=='string'||typeof n.text!=='string'||!['业务逻辑','字段说明','例外规则','其他'].includes(n.type)))throw Error();let incoming=data.notes.map(n=>({id:crypto.randomUUID(),ref:n.ref,type:n.type,text:n.text}));notes.push(...incoming);const ok=persistNotes();editingNote=null;render();drawNotes();toast('已追加导入 '+incoming.length+' 条备注'+(ok?'':'；本地保存失败，请导出备份'),!ok)}catch(e){toast('导入失败：请选择本需求导出的有效 JSON；现有备注未更改',true)}}
function clearNotes(){showModal('确认清空全部备注','<p>将删除当前浏览器中的 '+notes.length+' 条备注。建议先导出 JSON 备份。</p>',()=>{notes=[];editingNote=null;persistNotes();closeModal();render();drawNotes()})}

function filteredOrders(){return state.orders.filter(o=>accessible(o)&&(mode==='pos'?o.kind==='store':dmsKindFilter==='all'||o.kind===dmsKindFilter)).filter(o=>
 (statusFilter==='all'||o.status===statusFilter)&&(!query||[o.code,warehouses[o.source],warehouses[o.target],...o.items.map(i=>products[i.p].sku)].join(' ').toLowerCase().includes(query.toLowerCase()))&&

function renderPosOrders(){const o=state.orders.find(o=>o.id===selected),detail=page==='detail'&&o;let rows=filteredOrders();return '<div class="pos-split '+(detail?'has-detail':'')+'"><section class="pos-list-pane"><div class="app-header"><strong>门店调拨</strong><span class="spacer"></span>'+cartButton()+'<button class="icon-button" aria-label="刷新列表" onclick="render()">'+icon('refresh')+'</button><button class="icon-button solid" aria-label="新建调拨申请" onclick="startCreate()">'+icon('plus')+'</button></div><div class="pos-list-tools"><div class="pos-chips" role="group" aria-label="调拨筛选">'+[['all','全部'],['review','待审核'],['receive','待收货'],['mine','我申请的'],['todo','需我处理']].map(([v,t])=>'<button aria-pressed="'+posFilters.includes(v)+'" class="'+(posFilters.includes(v)?'selected':'')+'" onclick="setPosFilter(\''+v+'\')">'+t+'</button>').join('')+'</div><div class="app-search">'+icon('search')+'<input id="search" aria-label="查询调拨单" value="'+esc(query)+'" placeholder="搜索调拨单号、门店、SKU" oninput="posSearch(this.value)"></div></div><div class="pos-card-grid" id="posCards">'+rows.map(posOrderCard).join('')+(rows.length?'':'<div class="empty">暂无调拨单</div>')+'</div></section>'+(detail?'<section class="pos-detail-pane">'+renderPosDetail(o)+'</section>':'')+'</div>'}

function posOrderCard(o){return '<button class="order-card '+(o.id===selected?'selected':'')+'" onclick="selectOrder('+o.id+')"><div class="card-line"><strong>#'+o.code+'</strong>'+badge(o.status)+'</div><div class="card-time">'+o.created+'</div><div class="card-route"><span>'+warehouses[o.source]+'</span>'+icon('arrow')+'<span>'+warehouses[o.target]+'</span></div><div class="card-bottom"><span>'+o.items.length+' 个商品</span><strong>'+qty(o,'request')+' 件</strong></div></button>'}
function appDetailHeader(title,close){return '<div class="app-header centered"><button class="icon-button" aria-label="'+(close==='closeDetail()'?'关闭详情':'返回')+'" onclick="'+close+'">'+icon(close==='closeDetail()'?'close':'back')+'</button><strong>'+title+'</strong><span class="header-balance"></span></div>'}
function simpleRoute(o){return '<div class="app-route"><div><span class="muted">调出门店</span><strong>'+warehouses[o.source]+'</strong></div>'+icon('arrow')+'<div><span class="muted">调入门店</span><strong>'+warehouses[o.target]+'</strong></div></div>'}
function renderPosDetail(o){const canShip=o.source===role&&o.status==='pending',canReceive=o.target===role&&['inbound','partial'].includes(o.status),canAdd=o.target===role&&qty(o,'received')>0;
const addButton=canAdd?'<button class="'+(canReceive?'outline':'black')+'" onclick="quickAddOrder()">快速加购</button>':'';
const actions=canShip?'<button class="outline" onclick="askReject()">拒绝</button><button class="black" onclick="askShip()">同意并出库</button>':canReceive?addButton+'<button class="black" onclick="askReceive()">确认入库</button>':canAdd?addButton:'<span class="waiting">'+(o.status==='pending'?'等待调出门店审核':['inbound','partial'].includes(o.status)?'等待调入门店收货':labels[o.status])+'</span>';
return appDetailHeader('调拨详情','closeDetail()')+'<div class="pos-detail-scroll"><div class="detail-id"><strong>#'+o.code+'</strong>'+badge(o.status)+'</div>'+simpleRoute(o)+'<div class="app-section-label">商品明细 <span>'+o.items.length+' 个商品</span></div><div class="pos-goods">'+o.items.map((i,n)=>'<div class="pos-goods-row"><div class="goods-image">'+shoe(i.p)+'</div><div class="goods-description"><strong>'+products[i.p].name+'</strong><span>'+products[i.p].attr+'</span><small>'+products[i.p].sku+'</small><div class="goods-quantities"><span>申请 '+i.request+'</span>'+(o.status!=='pending'?'<span>已发 '+i.shipped+'</span><span>已收 '+i.received+'</span>':'<span>调出可用 '+state.stocks[o.source][i.p]+'</span>')+'</div></div><div class="receive-control">'+(canShip?'<span>本次调出</span>'+stepper('ship'+n,shipValues[n]??i.request,'调出数量 '+products[i.p].sku,'ship',n):canReceive?'<span>本次实收</span>'+stepper('receive'+n,receiveValues[n]??(i.shipped-i.received),'本次实收 '+products[i.p].sku,'receive',n):'<strong class="goods-qty">×'+(i.shipped||i.request)+'</strong>')+(canAdd&&i.received>0?'<button class="quick-add" aria-label="快速加购 '+products[i.p].sku+'" onclick="quickAddSku('+i.p+')">'+icon('plus')+'快速加购</button>':'')+'</div></div>').join('')+'</div>'+(o.remark?'<div class="simple-info"><span>备注</span><p>'+esc(o.remark)+'</p></div>':'')+(o.reason?'<div class="simple-info"><span>拒绝原因</span><p>'+esc(o.reason)+'</p></div>':'')+'<details class="operation-history"><summary>操作记录</summary>'+o.logs.slice().reverse().map(l=>'<p>'+esc(l.text)+'<small>'+l.time+'</small></p>').join('')+'</details></div><footer class="app-footer"><div><span class="muted">'+(canShip?'本次调出':canReceive?'待收数量':canAdd?'已收数量':'申请数量')+'</span><strong><span id="shipTotal">'+(canShip?shipTotal(o):canReceive?qty(o,'shipped')-qty(o,'received'):canAdd?qty(o,'received'):qty(o,'request'))+'</span> <small>件</small></strong></div><div class="footer-actions">'+actions+'</div></footer>';}
function stepper(id,value,label,type,n){let change=type==='draft'?'draft.items['+n+'].request=Number(this.value);updateDraftCount()':type==='ship'?'shipValues['+n+']=Number(this.value);updateShipTotal()':type==='cart'?'changeCartQuantity('+n+',this.value)':'receiveValues['+n+']=Number(this.value)';return '<div class="stepper"><button aria-label="减少 '+label+'" onclick="stepValue(\''+id+'\',-1,\''+type+'\','+n+')">'+icon('minus')+'</button><input id="'+id+'" aria-label="'+label+'" type="text" inputmode="numeric" value="'+value+'" oninput="'+change+'"><button aria-label="增加 '+label+'" onclick="stepValue(\''+id+'\',1,\''+type+'\','+n+')">'+icon('plus')+'</button></div>'}
function stepValue(id,delta,type,n){const node=$(id),min=type==='receive'?0:1,value=Math.max(min,(Number(node.value)||0)+delta);node.value=value;if(type==='draft'){draft.items[n].request=value;updateDraftCount()}else if(type==='receive')receiveValues[n]=value;else if(type==='ship'){shipValues[n]=value;updateShipTotal()}else if(type==='cart')changeCartQuantity(n,value);}
function updateDraftCount(){if($('cartTotal'))$('cartTotal').textContent=qty(draft,'request');if($('draftCount'))$('draftCount').textContent=qty(draft,'request')+' 件'}
function renderPosCreate(){const outOptions=[['A',warehouses.A],['B',warehouses.B]].filter(([v])=>v!==draft.target);return '<div class="pos-create-layout"><section class="pos-catalog"><div class="app-header"><button class="icon-button" aria-label="返回调拨列表" onclick="closeDetail()">'+icon('back')+'</button><strong>选择商品</strong></div><div class="catalog-search"><div class="app-search">'+icon('search')+'<input id="scan" aria-label="扫码条码" placeholder="扫描或输入 SKU / UPC" onkeydown="if(event.key===\'Enter\')scanSku()"></div><button class="icon-button solid" aria-label="扫码添加" onclick="scanSku()">'+icon('scan')+'</button></div><div class="catalog-grid">'+products.map((p,n)=>'<button class="product-card" aria-label="添加 '+p.sku+'" onclick="addByIndex('+n+')"><div class="catalog-image">'+shoe(n)+'</div><strong>'+p.name+'</strong><span>'+p.attr+'</span><div><small>可用 '+state.stocks[draft.source][n]+'</small>'+icon('plus')+'</div></button>').join('')+'</div></section><section class="pos-cart"><div class="app-header centered"><span class="header-balance"></span><strong>调拨申请</strong><span class="header-balance"></span></div><div class="cart-scroll"><div class="shop-line"><span>调出门店</span><select aria-label="调出方" onchange="draftField(\'source\',this.value)">'+options(outOptions,draft.source)+'</select></div><div class="shop-line"><span>调入门店</span><strong>'+warehouses[draft.target]+'</strong></div><div class="cart-label">商品 <span id="draftCount">'+qty(draft,'request')+' 件</span></div>'+(draft.items.length?draft.items.map((i,n)=>'<div class="cart-goods"><div class="goods-image">'+shoe(i.p)+'</div><div class="goods-description"><strong>'+products[i.p].name+'</strong><span>'+products[i.p].attr+'</span><small>'+products[i.p].sku+'</small><div class="cart-edit">'+stepper('draft'+n,i.request,'申请数量 '+products[i.p].sku,'draft',n)+'<button class="icon-button" aria-label="删除 '+products[i.p].sku+'" onclick="draft.items.splice('+n+',1);render()">'+icon('trash')+'</button></div></div></div>').join(''):'<div class="cart-empty">请选择调拨商品</div>')+'<div class="note-field"><label for="requestRemark">备注</label><textarea id="requestRemark" aria-label="调拨备注" rows="2" maxlength="255" placeholder="选填" oninput="draft.remark=this.value">'+esc(draft.remark)+'</textarea></div></div><footer class="app-footer"><div><span class="muted">合计</span><strong><span id="cartTotal">'+qty(draft,'request')+'</span> <small>件</small></strong></div><button class="black" onclick="prepareCreate()">提交申请</button></footer></section></div>';}
function dmsSidebar(){return '<aside class="dms-sidebar"><div class="dms-logo">DMS</div><div class="dms-menu-heading">库存管理 <span>⌄</span></div><button class="selected" onclick="openDmsTransfers()">调拨单</button></aside>'}

function renderDmsList(){const rows=filteredOrders(),list=Object.entries(warehouses);return '<section class="dms-search"><div class="search-combined"><span>调拨单号 ⌄</span><input id="search" aria-label="调拨单查询" placeholder="请输入" value="'+esc(query)+'" onkeydown="if(event.key===\'Enter\')doSearch()"></div><select aria-label="调拨类型筛选" onchange="dmsKindFilter=this.value;render()">'+options([['all','调拨类型'],['store','门店调拨'],['central','总仓调拨']],dmsKindFilter)+'</select><select aria-label="单据状态" onchange="statusFilter=this.value;render()">'+options([['all','状态'],...Object.entries(labels)],statusFilter)+'</select><select aria-label="筛选调出仓库" onchange="sourceFilter=this.value;render()">'+options([['','调出仓库'],...list],sourceFilter)+'</select><select aria-label="筛选调入仓库" onchange="targetFilter=this.value;render()">'+options([['','调入仓库'],...list],targetFilter)+'</select><div class="search-actions"><button class="primary" onclick="doSearch()">查询</button><button onclick="resetFilters()">重置</button></div></section><div class="dms-operate"><button class="primary" onclick="startCreate()">新增调拨单</button></div><section class="dms-table-area"><div class="table-scroll"><table><thead><tr><th>调拨单号</th><th>调拨类型</th><th>调出仓库</th><th>调入仓库</th><th>需求数量</th><th>调拨数量</th><th>实收数量</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'+rows.map(o=>'<tr><td>'+o.code+'</td><td>'+(o.kind==='store'?'门店调拨':'总仓调拨')+'</td><td>'+warehouses[o.source]+'</td><td>'+warehouses[o.target]+'</td><td>'+qty(o,'request')+'</td><td>'+qty(o,'shipped')+'</td><td>'+qty(o,'received')+'</td><td>'+labels[o.status]+'</td><td>'+o.created+'</td><td><button class="link" onclick="openOrder('+o.id+')">详情</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">暂无数据</div>')+'</div><div class="pagination">共 '+rows.length+' 条 <span>20 条/页</span><span>‹</span><span class="page-number">1</span><span>›</span></div></section>';}

function renderDmsCreate(){const list=kind==='store'?[['A',warehouses.A],['B',warehouses.B]]:[['C',warehouses.C],['D',warehouses.D]];return dmsPageHeader('新增调拨单')+'<div class="dms-form-scroll"><div class="dms-fields"><label><span class="required">调拨类型</span><select aria-label="新建调拨类型" onchange="setCreateKind(this.value)">'+options([['store','门店调拨'],['central','总仓调拨']],kind)+'</select></label><label><span class="required">调出仓库</span><select aria-label="调出方" '+(kind==='central'&&['C','D'].includes(role)?'disabled':'')+' onchange="draftField(\'source\',this.value)">'+options(list,draft.source)+'</select></label><label><span class="required">调入仓库</span><select aria-label="调入方" onchange="draftField(\'target\',this.value)">'+options(list,draft.target)+'</select></label><label class="wide"><span>备注</span><input aria-label="调拨备注" maxlength="255" placeholder="请输入" value="'+esc(draft.remark)+'" oninput="draft.remark=this.value"></label></div><div class="dms-section-heading">商品明细</div><div class="dms-product-toolbar"><div class="search-combined"><span>SKU / UPC</span><input id="scan" aria-label="扫码条码" placeholder="请输入" onkeydown="if(event.key===\'Enter\')scanSku()"></div><button onclick="scanSku()">添加</button><button onclick="openProductPicker()">选择商品</button></div><div class="table-scroll"><table><thead><tr><th>商品</th><th>SKU</th><th>颜色 / 尺码</th><th>可用库存</th><th class="required">需求数量</th><th>操作</th></tr></thead><tbody>'+draft.items.map((i,n)=>'<tr><td>'+products[i.p].name+'</td><td>'+products[i.p].sku+'</td><td>'+products[i.p].attr+'</td><td>'+state.stocks[draft.source][i.p]+'</td><td><input class="num" aria-label="申请数量 '+products[i.p].sku+'" inputmode="numeric" value="'+i.request+'" onchange="draft.items['+n+'].request=Number(this.value)"></td><td><button class="link" onclick="draft.items.splice('+n+',1);render()">删除</button></td></tr>').join('')+'</tbody></table>'+(draft.items.length?'':'<div class="empty">暂无商品</div>')+'</div></div><footer class="dms-bottom"><button onclick="closeDetail()">取消</button><button class="primary" onclick="prepareCreate()">'+(kind==='central'?'创建并出库':'提交')+'</button></footer>';}

function renderDmsDetail(){const o=current();if(!o)return '';const canShip=o.source===role&&o.status==='pending',canReceive=o.target===role&&['inbound','partial'].includes(o.status);return dmsPageHeader('调拨单详情','<span>'+labels[o.status]+'</span>')+'<div class="dms-form-scroll"><div class="dms-detail-fields"><div><span>调拨类型</span>'+(o.kind==='store'?'门店调拨':'总仓调拨')+'</div><div><span>调拨单号</span>'+o.code+'</div><div><span>调出仓库</span>'+warehouses[o.source]+'</div><div><span>调入仓库</span>'+warehouses[o.target]+'</div><div><span>创建时间</span>'+o.created+'</div>'+(o.remark?'<div><span>备注</span>'+esc(o.remark)+'</div>':'')+(o.reason?'<div><span>拒绝原因</span>'+esc(o.reason)+'</div>':'')+'</div><div class="dms-section-heading">商品明细</div><div class="table-scroll"><table><thead><tr><th>商品</th><th>SKU</th><th>颜色 / 尺码</th><th>需求数量</th><th>调拨数量</th><th>实收数量</th>'+(canReceive?'<th>待收数量</th><th class="required">本次实收</th>':'')+'</tr></thead><tbody>'+o.items.map((i,n)=>'<tr><td>'+products[i.p].name+'</td><td>'+products[i.p].sku+'</td><td>'+products[i.p].attr+'</td><td>'+i.request+'</td><td>'+i.shipped+'</td><td>'+i.received+'</td>'+(canReceive?'<td>'+(i.shipped-i.received)+'</td><td><input id="receive'+n+'" class="num" aria-label="本次实收 '+products[i.p].sku+'" inputmode="numeric" value="'+(receiveValues[n]??(i.shipped-i.received))+'" oninput="receiveValues['+n+']=Number(this.value)"></td>':'')+'</tr>').join('')+'</tbody></table></div><details class="operation-history"><summary>操作记录</summary>'+o.logs.slice().reverse().map(l=>'<p>'+esc(l.text)+'<small>'+l.time+'</small></p>').join('')+'</details></div><footer class="dms-bottom">'+(role==='总部'&&o.status==='pending'?'<button onclick="askVoid()">作废</button>':'')+(canShip?'<button onclick="askReject()">拒绝</button><button class="primary" onclick="askShip()">同意并出库</button>':canReceive?'<button class="primary" onclick="askReceive()">确认入库</button>':'')+'</footer>';}

function assumptions(){return '<div class="settings-notes"><strong>演示口径</strong><p>多选筛选按并集匹配；全部与其他选项互斥。需我处理包含待我审核和待我收货；我申请的按当前门店发起的POS申请判定。</p><p>审核按1至申请数量的整数改量，保留原申请数；未足额调出不自动生成补调单（演示假设）。增量调出和取消某个SKU待确认。</p><p>快速加购每次每个已收SKU加入1件，重复点击累加；加入购物车不扣库存，结算才销售出库。购物车为演示状态，不接支付。</p><p>同租户、同区域、同币种；总仓创建即出库，门店创建待调拨。总仓分批收货及总部作废权限待确认。</p></div>'}
function openSettings(){settingsOpen=true;drawSettings()}

function resetDemo(){showModal('恢复初始状态','<p>恢复模拟单据、库存和购物车，保留我的备注。</p>',()=>{fresh();page='list';selected=null;query='';statusFilter='all';scenario='normal';posFilters=['all'];dmsKindFilter='all';sourceFilter='';targetFilter='';shipValues={};receiveValues={};closeModal();render();toast('已恢复初始状态')});}
function validateDraft(){if(draft.source===draft.target)return '调出与调入方不能相同';const allowed=kind==='central'?['C','D']:['A','B'];if(!allowed.includes(draft.source)||!allowed.includes(draft.target))return '请选择相同类型的仓库';if(kind==='central'&&!['总部','C','D'].includes(role))return '当前角色无总仓调拨权限';if(mode==='dms'&&kind==='store'&&['C','D'].includes(role))return '当前角色无门店调拨权限';if(!draft.items.length)return '请选择商品';if(draft.items.some(i=>!Number.isSafeInteger(i.request)||i.request<=0||i.request>999999))return '数量须为正整数';if(kind==='central'&&draft.items.some(i=>i.request>state.stocks[draft.source][i.p]))return '调出仓可用库存不足';return '';}
function prepareCreate(){let error=validateDraft();if(error)return toast(error,true);showModal(kind==='central'?'创建并出库':'提交调拨申请','<p>'+warehouses[draft.source]+' → '+warehouses[draft.target]+'</p><p>'+draft.items.length+' 个商品，共 '+qty(draft,'request')+' 件'+(kind==='central'?'，确认后立即出库。':'。')+'</p>',()=>{let e=validateDraft();if(e)return modalError(e);if(scenario==='network'||kind==='central'&&scenario!=='normal')return modalError(failScenario());let id=state.next++;let o={...structuredClone(draft),id,kind,code:(kind==='central'?'CW':'ST')+'261026'+String(id).padStart(3,'0'),status:'pending',origin:mode==='pos'?'POS · '+role+'店':'DMS',created:time(),logs:[]};log(o,o.origin+'提交调拨申请');if(kind==='central')ship(o);state.orders.unshift(o);selected=o.id;page='detail';receiveValues={};closeModal();render();toast(kind==='central'?'已创建并出库':'申请已提交');});}
function askShip(){const o=current(),amounts=o.items.map((i,n)=>mode==='pos'?(shipValues[n]??i.request):i.request);const validation=()=>{if(o.source!==role||o.status!=='pending')return '单据状态已变化';if(amounts.some((v,n)=>!Number.isSafeInteger(v)||v<1||v>o.items[n].request))return '调出数量须为不超过申请数量的正整数';if(amounts.some((v,n)=>v>state.stocks[o.source][o.items[n].p]))return '可用库存不足';return ''};let error=validation();if(error)return toast(error,true);showModal('同意并出库','<p>'+warehouses[o.source]+' → '+warehouses[o.target]+'</p><p>申请 '+qty(o,'request')+' 件，本次出库 '+amounts.reduce((a,b)=>a+b,0)+' 件。</p>',()=>{const error=validation()||failScenario();if(error)return modalError(error);const changes=o.items.flatMap((i,n)=>amounts[n]!==i.request?[products[i.p].sku+' 申请'+i.request+' → 调出'+amounts[n]]:[]);if(changes.length)log(o,'审核调整数量：'+changes.join('；'));ship(o,amounts);shipValues={};closeModal();render();toast('已出库');});}
function askReject(){const o=current();showModal('拒绝申请','<textarea id="rejectReason" rows="3" maxlength="128" placeholder="请输入拒绝原因"></textarea>',()=>{const r=$('rejectReason').value.trim();if(!r)return modalError('请填写拒绝原因');if(o.source!==role||o.status!=='pending')return modalError('单据状态已变化');o.reason=r;o.status='rejected';log(o,warehouses[role]+'拒绝申请：'+r);closeModal();render();toast('已拒绝');});}
function askReceive(){const o=current(),ns=o.items.map((i,n)=>Number($('receive'+n).value));if(ns.some((v,n)=>!Number.isSafeInteger(v)||v<0||v>o.items[n].shipped-o.items[n].received))return toast('实收数量须为不超过待收数量的非负整数',true);if(!ns.some(v=>v>0))return toast('实收合计须大于 0',true);const total=ns.reduce((a,b)=>a+b,0);showModal('确认入库','<p>本次实收 '+total+' 件，确认入库？</p>',()=>{if(role!==o.target||!['inbound','partial'].includes(o.status))return modalError('单据状态已变化');const e=failScenario('receive');if(e)return modalError(e);if(ns.some((v,n)=>v>o.items[n].shipped-o.items[n].received))return modalError('待收数量已变化');o.items.forEach((i,n)=>{i.received+=ns[n];state.stocks[o.target][i.p]+=ns[n];state.transit[o.target][i.p]-=ns[n]});o.status=qty(o,'shipped')===qty(o,'received')?'done':'partial';log(o,warehouses[o.target]+'入库 '+total+' 件');receiveValues={};closeModal();render();toast(total+' 件已入库');});}
function failScenario(action='ship'){return scenario==='network'?'网络异常，请重试':action==='ship'&&scenario==='stock'?'可用库存不足，无法出库':action==='ship'&&scenario==='locked'?'库存已锁定，无法出库':''}

function toast(message,error=false){const t=$('toast');t.hidden=false;t.className='toast';t.textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2800)}

function matchesPosFilter(o,f){const review=o.source===role&&o.status==='pending',receive=o.target===role&&['inbound','partial'].includes(o.status);return f==='review'?review:f==='receive'?receive:f==='mine'?o.origin==='POS · '+role+'店':f==='todo'?review||receive:false}
function shipTotal(o){return o.items.reduce((sum,i,n)=>sum+(shipValues[n]??i.request),0)}
function updateShipTotal(){if($('shipTotal'))$('shipTotal').textContent=shipTotal(current())}
function cartItems(){return state.carts[role]||[]}
function cartCount(){return cartItems().reduce((sum,i)=>sum+(Number.isSafeInteger(i.quantity)&&i.quantity>0?i.quantity:0),0)}
function cartButton(){return '<button class="icon-button cart-launch" aria-label="购物车（'+cartCount()+'）" onclick="openCart()">'+icon('cart')+(cartCount()?'<span class="cart-badge">'+cartCount()+'</span>':'')+'</button>'}
function openCart(){page='cart';render()}
function openTransfers(){page='list';selected=null;shipValues={};receiveValues={};render()}
function quickAddSku(p){const o=current();if(!o||o.target!==role||!o.items.some(i=>i.p===p&&i.received>0))return toast('请先确认该商品入库',true);addCartProducts([p])}
function quickAddOrder(){const o=current();if(!o||o.target!==role)return;addCartProducts(o.items.filter(i=>i.received>0).map(i=>i.p))}
function addCartProducts(ps){if(!ps.length)return toast('暂无可加购商品',true);const cart=cartItems();if(cart.some(i=>!Number.isSafeInteger(i.quantity)||i.quantity<1))return toast('请先修正购物车数量',true);if(ps.some(p=>(cart.find(i=>i.p===p)?.quantity||0)+1>state.stocks[role][p]))return toast('可用库存不足，无法加购',true);ps.forEach(p=>{const existing=cart.find(i=>i.p===p);if(existing)existing.quantity++;else cart.push({p,quantity:1})});state.carts[role]=cart;render();toast('已加入购物车')}
function changeCartQuantity(p,value){const i=cartItems().find(i=>i.p===p);if(!i)return;const n=Number(value);i.quantity=n;if($('checkoutCount'))$('checkoutCount').textContent=cartCount()}
function removeCartSku(p){state.carts[role]=cartItems().filter(i=>i.p!==p);render()}
function renderCart(){return '<div class="pos-create-layout"><section class="pos-catalog"><div class="app-header"><button class="icon-button" aria-label="返回调拨单" onclick="page=selected?\'detail\':\'list\';render()">'+icon('back')+'</button><strong>商品</strong></div><div class="catalog-grid cart-catalog">'+products.map((p,n)=>'<button class="product-card" aria-label="购物车添加 '+p.sku+'" onclick="addCartProducts(['+n+'])"><div class="catalog-image">'+shoe(n)+'</div><strong>'+p.name+'</strong><span>'+p.attr+'</span><div><small>可用 '+state.stocks[role][n]+'</small>'+icon('plus')+'</div></button>').join('')+'</div></section><section class="pos-cart"><div class="app-header centered"><span class="header-balance"></span><strong>购物车</strong><span class="header-balance"></span></div><div class="cart-scroll"><div class="shop-line"><span>当前门店</span><strong>'+warehouses[role]+'</strong></div>'+(cartItems().length?cartItems().map(i=>'<div class="cart-goods"><div class="goods-image">'+shoe(i.p)+'</div><div class="goods-description"><strong>'+products[i.p].name+'</strong><span>'+products[i.p].attr+'</span><small>'+products[i.p].sku+' · 可用 '+state.stocks[role][i.p]+'</small><div class="cart-edit">'+stepper('cart'+i.p,i.quantity,'购物车数量 '+products[i.p].sku,'cart',i.p)+'<button class="icon-button" aria-label="移除 '+products[i.p].sku+'" onclick="removeCartSku('+i.p+')">'+icon('trash')+'</button></div></div></div>').join(''):'<div class="cart-empty">购物车为空</div>')+'</div><footer class="app-footer"><div><span class="muted">合计</span><strong><span id="checkoutCount">'+cartCount()+'</span> <small>件</small></strong></div><button class="black" onclick="checkoutCart()">结算</button></footer></section></div>'}
function checkoutCart(){const items=structuredClone(cartItems()),shop=role;const validate=()=>!items.length?'购物车为空':items.some(i=>!Number.isSafeInteger(i.quantity)||i.quantity<1)?'购物车数量须为正整数':items.some(i=>i.quantity>state.stocks[shop][i.p])?'可用库存不足':'';let error=validate();if(error)return toast(error,true);showModal('确认销售出库','<p>'+warehouses[shop]+'，共 '+items.reduce((s,i)=>s+i.quantity,0)+' 件。</p>',()=>{let e=role!==shop?'当前门店已变化':validate();if(e)return modalError(e);if(scenario==='network')return modalError('网络异常，请重试');items.forEach(i=>state.stocks[shop][i.p]-=i.quantity);state.carts[shop]=[];closeModal();render();toast('销售出库成功')})}
function openDmsTransfers(){page='list';selected=null;render()}
function setCreateKind(v){kind=v;draft={source:v==='central'?(['C','D'].includes(role)?role:'C'):'B',target:v==='central'?(role==='D'?'C':'D'):'A',remark:draft.remark,items:[]};render()}
let posFilters=['all'],shipValues={},dmsKindFilter='all';
iconPaths.transfer='M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4';
iconPaths.cart='m3 3 3 2 3 12h11l2-9H7M10 21h.01M19 21h.01';
fresh();render();
</script>
</body>
