<head>
  <meta charset="utf-8" />

  <title>VIVAIA 税务配置与巴西小票方案</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #fff;
      background: #14181f;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .portal {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
    }
    .portal-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 22px;
      background: #14181f;
      border-bottom: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 3px 14px rgba(0,0,0,.18);
    }
    .portal-brand {
      padding-right: 22px;
      border-right: 1px solid rgba(255,255,255,.12);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .portal-label {
      color: rgba(255,255,255,.52);
      font-size: 12px;
      white-space: nowrap;
    }
    .portal-tabs {
      align-self: stretch;
      display: flex;
      align-items: stretch;
      gap: 3px;
    }
    .portal-tab {
      position: relative;
      min-width: 172px;
      padding: 0 20px;
      border: 0;
      color: rgba(255,255,255,.72);
      background: transparent;
      font: 13px/1 Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      cursor: pointer;
    }
    .portal-tab:hover { color: #fff; background: rgba(255,255,255,.05); }
    .portal-tab.active {
      color: #fff;
      background: #252c38;
      font-weight: 600;
    }
    .portal-tab.active::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 0;
      height: 3px;
      background: #3370ff;
    }
    .portal-hint {
      margin-left: auto;
      color: rgba(255,255,255,.48);
      font-size: 11px;
      white-space: nowrap;
    }
    .frame-stage {
      position: relative;
      min-height: 0;
      background: #f0f2f5;
    }
    .solution-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .solution-frame.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }
    @media (max-width: 850px) {
      .portal-label, .portal-hint { display: none; }
      .portal-header { gap: 8px; padding-inline: 10px; }
      .portal-brand { padding-right: 10px; font-size: 14px; }
      .portal-tab { min-width: 140px; padding-inline: 10px; font-size: 12px; }
    }
  </style>
</head>

    const decodePage = (value) => {
      const bytes = Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    };
    document.getElementById('taxFrame').srcdoc = decodePage(encodedPages.tax);
    document.getElementById('receiptFrame').srcdoc = decodePage(encodedPages.receipt);

    document.querySelectorAll('.portal-tab').forEach((button) => {
      button.addEventListener('click', () => {
        const page = button.dataset.page;
        document.querySelectorAll('.portal-tab').forEach((item) => {
          item.classList.toggle('active', item === button);
        });
        document.getElementById('taxFrame').classList.toggle('active', page === 'tax');
        document.getElementById('receiptFrame').classList.toggle('active', page === 'receipt');
      });
    });
